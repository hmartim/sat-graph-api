        This action's purpose is **structural enumeration and navigation** of a Version state, not temporal resolution or version filtering. Temporal resolution occurs separately, for example through `getValidVersions` or `getApplicableVersions`; once a Version has been selected, this operation traverses the structural relationships stored for that Version.

        Version-level structural navigation does not independently evaluate the `validityInterval` or `applicabilityInterval` of descendant Versions. Consumers that need the temporal status of individual descendants can retrieve or resolve those Versions separately.

        A Version can be reused by multiple parent Versions over time. This does not make downward traversal ambiguous: the supplied parent Version determines the structural children and descendants that compose that Version state. Upward navigation can require temporal context to select among multiple historical parents; use `getVersionParents` or `getVersionAncestors` for that purpose.

