openapi: 3.0.3
info:
  title: SAT-Graph API
  version: 3.0.0
  description: |
    This is the official OpenAPI 3.x specification for the **SAT-Graph API**,
    a formal interface for querying the Structure-Aware Temporal Graph (SAT-Graph).

    **Domain neutrality:** The SAT-Graph core models structured Items, temporal Versions,
    state-changing Actions, textual representations, classifications, and relations without
    fixing a particular application domain. Legal information is the motivating and primary
    reference domain used in the accompanying research and examples, but deployment-defined
    vocabularies are not restricted to legal values unless explicitly stated by the core contract.

    Structured outputs and composable primitives allow consumers to construct verifiable
    and auditable retrieval workflows; logging and preservation of execution traces are
    responsibilities of the consuming application or agent harness.

    The complete architectural framework is proposed in the paper:
    - **[An Ontology-Driven Graph RAG for Legal Norms: A Structural, Temporal, and Deterministic Approach](https://arxiv.org/abs/2508.00827)**

    ## API Architecture

    This specification implements a **two-layer architecture**:

    ### 1. Canonical Core API (Research Paper)
    The foundational set of actions formally specified in the research paper:
    - SAT-Graph ontology: Item, Version, Action, Theme, TextUnit
    - Temporal reasoning and deterministic retrieval
    - Structural navigation and causal tracing
    - Minimal set of composable primitives

    ### 2. Extended API (Production Enhancements)
    Additional capabilities for production use cases:
    - **Relation System**: Semantic overlay graph for cross-document relationships
      (citations, references, dependencies)
    - **Convenience Operations**: Optimized endpoints for common patterns
    - Implements "Future Directions" outlined in the research paper

    ---

    **Authentication Note:** Authentication and authorization are not part of the
    SAT-Graph graph model or retrieval semantics. This OpenAPI profile uses API-key
    authentication through the `Authorization` header. Other deployments may use
    different security mechanisms while preserving the SAT-Graph API semantics.

    **Data Scoping Note:** The API serves data from multiple providers, called **DataSources**.
    All requests are automatically scoped to the DataSources granted to your API key.
    Many search functions also provide an optional `dataSources` parameter for more granular filtering.
components:
  schemas:
    ID:
      type: string
      description: A generic, unique identifier for an entity within the SAT-Graph. This ID serves as the primary key for the entity. It is typically a formally structured string, such as a URN or URI, but is not strictly limited to those formats. It must be unique within the knowledge graph.
      minLength: 1
      example: urn:lex:br:federal:constituicao:1988-10-05;1988!art5
    JSON:
      description: 'Represents any valid JSON value. This can be a structured object, an array, a simple string, a number, or a boolean. Properties that use this schema may independently declare `nullable: true`.'
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
        - type: string
        - type: number
        - type: boolean
      example:
        publicationDetails:
          date: '1988-10-05'
          gazette: D.O.U.
    TimeInterval:
      type: array
      description: |
        Represents a time interval defined by a start date-time and an optional end date-time. All values must conform to the RFC 3339 'date-time' format (e.g., 'YYYY-MM-DDTHH:mm:ssZ').
        **To represent a whole day, use the beginning of that day in UTC.** For example, the date '1988-10-05' should be represented as '1988-10-05T00:00:00Z'.
      minItems: 2
      maxItems: 2
      items:
        type: string
        format: date-time
        nullable: true
      example:
        - '2000-02-14T00:00:00Z'
        - null
    DataSourcesSchema:
      type: array
      description: |
        A list of data source identifiers. A data source is the system or provider
        where an entity originates (e.g., 'dataSource_Senate').
      items:
        type: string
      uniqueItems: true
      example:
        - dataSource_A
    MetadataFilter:
      type: object
      description: A structured object for applying metadata-based filters.
      properties:
        itemMetadataFilter:
          $ref: '#/components/schemas/ItemMetadataFilterSchema'
        versionMetadataFilter:
          type: object
          additionalProperties: true
          description: Key-value pairs to filter against the metadata of the 'Version'.
          example:
            publicationDate:
              '>=': '2010-01-01T00:00:00Z'
    ItemMetadataFilterSchema:
      type: object
      additionalProperties: true
      description: A set of key-value pairs to filter against the atemporal metadata of an 'Item'. The exact query capabilities (e.g., range queries, existence checks) depend on the backend implementation.
      example:
        jurisdiction: federal
        type: Statute
    ContentQuery:
      type: object
      description: |
        A unified query structure for ranked retrieval that can combine semantic and
        lexical signals. The SAT-Graph API defines the observable search semantics;
        the retrieval engine, index technology, fusion method, and ranking implementation
        are deployment-specific.

        **Search Strategies:**
        - `hybrid`: Combines semantic and lexical signals in ranked retrieval (default).
        - `semanticOnly`: Uses only semantic similarity signals.
        - `lexicalOnly`: Uses only lexical/full-text signals for candidate retrieval and ranking. It does **not** request or guarantee exhaustive enumeration of all lexical matches.

        All strategies in this schema are search/ranking strategies. Exhaustive inspection
        of a known Version scope is performed by explicitly enumerating that scope and
        retrieving its TextUnits, rather than by treating search `topK` as an exhaustive
        enumeration mechanism.

        Concrete deployments may implement these semantics using different search engines,
        indexes, ranking functions, or fusion mechanisms.
      properties:
        strategy:
          type: string
          enum:
            - hybrid
            - semanticOnly
            - lexicalOnly
          default: hybrid
          description: |
            The search strategy to employ:
            - `hybrid`: semantic and lexical signals both participate in ranked retrieval.
            - `semanticOnly`: only semantic similarity participates in ranked retrieval.
            - `lexicalOnly`: only lexical/full-text matching participates in ranked retrieval; this does not imply exhaustive enumeration.
          example: hybrid
        semantic:
          type: object
          description: Configuration for semantic search.
          properties:
            queryText:
              type: string
              description: |
                Natural-language query text used to express the semantic intent of the search.
              example: políticas de garantia de renda mínima para famílias vulneráveis
            weight:
              type: number
              format: float
              minimum: 0
              maximum: 1
              default: 0.5
              description: |
                Relative contribution of the semantic signal in hybrid mode. Higher values
                give greater weight to semantic similarity. When both semantic and lexical
                weights are supplied, deployments should interpret them consistently as
                relative contributions to hybrid ranking.
              example: 0.7
            topK:
              type: integer
              format: int32
              minimum: 1
              description: |
                Optional. Maximum number of semantic candidates considered before final
                ranking or fusion. This is a candidate/ranking limit, not an exhaustive
                enumeration request.
              example: 100
          required:
            - queryText
        lexical:
          type: object
          description: Configuration for lexical/full-text search.
          properties:
            queryText:
              type: string
              description: |
                Keywords or phrases for lexical/full-text retrieval. Exact syntax and
                supported lexical operators are deployment-specific and should be documented
                by the implementation.
              example: '"artigo 6º" OR "renda básica"'
            weight:
              type: number
              format: float
              minimum: 0
              maximum: 1
              default: 0.5
              description: |
                Relative contribution of the lexical signal in hybrid mode. Higher values
                give greater weight to lexical matching.
              example: 0.3
            topK:
              type: integer
              format: int32
              minimum: 1
              description: |
                Optional. Maximum number of lexical candidates considered before final
                ranking or fusion. This is a candidate/ranking limit, not an exhaustive
                enumeration request.
              example: 100
          required:
            - queryText
        clauses:
          type: array
          description: |
            Advanced clauses for mandatory, boosting, or exclusion conditions. The API
            defines their observable intent; the underlying query mechanism is deployment-specific.
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - mustContain
                  - shouldContain
                  - mustNotContain
                description: |
                  - `mustContain`: results must satisfy this lexical condition.
                  - `shouldContain`: matching results receive a relevance boost.
                  - `mustNotContain`: matching results are excluded.
                example: mustContain
              text:
                type: string
                description: The term or phrase for this clause.
                example: Constituição Federal
              boost:
                type: number
                format: float
                minimum: 0
                default: 1.5
                description: |
                  Relative boost for `shouldContain` clauses. Ignored for other clause types.
                example: 2
            required:
              - type
              - text
          example:
            - type: mustContain
              text: Constituição Federal
            - type: shouldContain
              text: direitos sociais
              boost: 1.8
      anyOf:
        - required:
            - semantic
        - required:
            - lexical
      example:
        strategy: hybrid
        semantic:
          queryText: políticas de garantia de renda mínima para famílias vulneráveis
          weight: 0.7
        lexical:
          queryText: '"artigo 6º" OR "renda básica"'
          weight: 0.3
        clauses:
          - type: mustContain
            text: Constituição Federal
    VocabularyEntry:
      type: object
      description: Describes one deployment-defined vocabulary value exposed through an introspection primitive. The `value` is the machine-readable token used in API requests and responses, while `label` and `description` provide human- and agent-readable semantics for that deployment.
      required:
        - value
        - label
        - description
      properties:
        value:
          type: string
          minLength: 1
          description: The canonical machine-readable value used by the API.
        label:
          type: string
          minLength: 1
          description: A human-readable name for the vocabulary entry.
        description:
          type: string
          minLength: 1
          description: A semantic explanation of what the value means in this deployment.
    Item:
      type: object
      description: |
        Represents a timeless, foundational entity within the SAT-Graph. An `Item` acts as a stable, version-agnostic anchor for a structural or conceptual entity.
        A deployment may use Items for whole documents, document components, abstract concepts, named entities, or other domain-defined anchors. In the legal reference domain, examples include a Constitution, Article, Paragraph, legal concept, or institution.
        The `Item` itself is a structural and conceptual anchor. Its textual representations are provided by associated `TextUnit` objects, while time-varying state is represented through `Version` objects.
        An Item remains addressable independently of whether it currently has a valid or applicable Version. Expiration, revocation, repeal, replacement, or other temporal changes affect Versions and their temporal state; they do not by themselves remove the canonical Item.
      required:
        - id
        - typeId
        - label
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: The primary identifier for this Item. The field is a string with no format restriction, allowing each implementation to choose an appropriate strategy, such as UUIDs, deterministic hashes, URNs, or URIs.
        urn:
          type: string
          nullable: true
          description: An optional persistent semantic identifier expressed as a URN when the deployment uses a URN-based identification scheme. The concrete namespace and syntax are deployment-specific. In the legal reference domain, URN LEX is one example.
          minLength: 1
          example: urn:lex:br:federal:constituicao:1988-10-05;1988!art5
        url:
          type: string
          format: uri
          nullable: true
          description: An optional canonical electronic address for this Item or an authoritative source associated with it. The concrete meaning is deployment-specific and is not used by the core API for graph inference.
          minLength: 1
          example: https://normas.leg.br/?urn=urn:lex:br:federal:constituicao:1988-10-05;1988!art5
        typeId:
          $ref: '#/components/schemas/ID'
          description: The unique identifier of the ItemType that classifies this Item. The ItemType taxonomy defines the deployment's formal structural or conceptual type system. In a legal-domain implementation, example types may include Constitution, Article, or Paragraph.
          example: article
        label:
          type: string
          description: The human-readable label or title for the Item.
          minLength: 1
          example: Brazilian Constitution of 1988
        parentId:
          $ref: '#/components/schemas/ID'
          nullable: true
          description: The canonical, atemporal parent adopted by the implementation for this Item. This field defines the Item-level hierarchy used by Item navigation and does not encode historical structural position. Historical structural states are represented through Version-level relationships.
        metadata:
          $ref: '#/components/schemas/JSON'
          nullable: true
          description: |-
            A flexible field for any valid JSON data containing atemporal, domain-specific properties of the Item.
            **Best Practice:** Use internationally recognized vocabularies where appropriate to improve semantic interoperability. In the legal reference domain, schema.org/Legislation is one possible vocabulary. See [Metadata Best Practices](../../docs/METADATA_BEST_PRACTICES.md) for guidance.
    Version:
      type: object
      description: |
        Represents a specific, time-bound version of an Item (a TV/CTV). It captures the semantic state and a specific structural state of an Item, but is language-agnostic and contains no direct textual content. The structural children and descendants associated with this Version are the Versions that compose this stored structural state; Version-level navigation traverses those relationships deterministically and does not itself perform temporal resolution. Temporal resolution is handled separately by primitives such as getValidVersions and getApplicableVersions.
      required:
        - id
        - itemId
        - type
        - validityInterval
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: 'The primary, opaque identifier for this Version instance. The field is a string with no format restriction, allowing each implementation to choose the most appropriate strategy: UUIDs for distributed systems, deterministic hashes, or even the URN itself for simplified implementations. In the examples of this specification, the id field is populated with the URN to facilitate reading and manual tracing of relationships in JSON objects.'
          example: urn:lex:br:federal:constituicao:1988@1988-10-05
        urn:
          type: string
          nullable: true
          description: A persistent semantic identifier for this specific Version when the deployment uses a URN-based identification scheme. In the legal reference domain, URN LEX may extend an Item identifier with temporal information to support precise version citation and interoperability.
          minLength: 1
          example: urn:lex:br:federal:constituicao:1988-10-05;1988@2020-01-15!art5
        url:
          type: string
          format: uri
          nullable: true
          description: The canonical electronic address (Dereferenceable URI) pointing to the official source of this specific version's text. This field is used exclusively for human user interface (access provenance), not for logical inferences by the agent.
          minLength: 1
          example: https://normas.leg.br/?urn=urn:lex:br:federal:constituicao:1988-10-05;1988@2020-01-15!art5
        itemId:
          $ref: '#/components/schemas/ID'
          description: The ID of the timeless 'Item' this object is a version of.
          example: urn:lex:br:federal:constituicao:1988
        type:
          type: string
          description: |-
            The deployment-defined classification of this Version. The vocabulary and semantics are implementation- and domain-specific; consumers can discover supported values through `getSupportedVersionTypes`.
            For example, in a legal-domain implementation, Version types may include `statutory` for legislative textual states and `interpretive` for interpretive states associated with case law or another authoritative interpretation.
          example: statutory
        validityInterval:
          $ref: '#/components/schemas/TimeInterval'
          description: The time interval during which this Version is considered valid according to the temporal semantics of the deployment. In the legal reference domain, this corresponds to the period of legal validity.
        applicabilityInterval:
          $ref: '#/components/schemas/TimeInterval'
          nullable: true
          description: The time interval during which this Version is applicable or effective according to the deployment's domain semantics. It is distinct from `validityInterval` when a domain needs to represent a difference between formal validity and effective applicability. In the legal reference domain, this supports cases where a norm is valid but not yet, or no longer, producing legal effects.
        producedByActionId:
          $ref: '#/components/schemas/ID'
          nullable: true
          description: |-
            Reference to the **Action** that created this version (Provenance/Backward Causality). This property materializes the inverse relationship of LRMoo **R16 created**.

            Through this property, the agent can discover the origin of a version (e.g., "This text came from the caput of Art. 1 of Constitutional Amendment 20").

            This controlled denormalization eliminates the need for full database scans for provenance questions, essential for legal reasoning.
          example: urn:lex:br:federal:emenda.constitucional:2000-02-14;26@2000-02-14!art1_cpt_alt1_art6_cpt
        terminatedByActionId:
          $ref: '#/components/schemas/ID'
          nullable: true
          description: |-
            Reference to the **Action** that terminated the validity of this version (Backward Causality). This property materializes the inverse relationship of CIDOC-CRM **P31 has modified**.

            This is null for versions that are still active (validityInterval.end is null).

            Through this property, the agent can discover what ended a version's validity (e.g., "This version was terminated by Constitutional Amendment 45/2004").
          example: urn:lex:br:federal:emenda.constitucional:2004-12-30;45@2004-12-30!art1_cpt_alt1_art5_cpt
        usedAsSourceInActionIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: |-
            References to the **Actions** that used this specific version as source or provenance for changes elsewhere in the graph (Forward Causality). This property materializes the inverse relationship of LRMoo **R15 has used**.
            In the legal reference domain, this may represent a legislative command whose content authorizes or specifies modifications to another provision.
          example:
            - urn:lex:br:federal:emenda.constitucional:2000-02-14;26@2000-02-14!art1_cpt_alt1_art6_cpt
        metadata:
          $ref: '#/components/schemas/JSON'
          nullable: true
          description: |-
            A flexible field for any valid JSON data specific to this version.

            **Best Practice:** Use internationally recognized vocabularies such as schema.org to enable semantic interoperability. See [Metadata Best Practices](../../docs/METADATA_BEST_PRACTICES.md) for guidance on structuring temporal version metadata.
    Theme:
      type: object
      description: |
        Represents an atemporal, conceptual entity used to classify Items and organize knowledge. Themes form a taxonomy (e.g., "Social Security" is a child of "Public Law") and serve as entry points for curated, topic-based searches.
      required:
        - id
        - label
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: 'The primary, opaque identifier for this Theme. The field is a string with no format restriction, allowing each implementation to choose the most appropriate strategy: UUIDs for distributed systems, deterministic hashes, or semantic identifiers. In the examples of this specification, the id field may be populated with a semantic identifier to facilitate reading.'
        urn:
          type: string
          nullable: true
          description: The persistent semantic identifier in URN format for this Theme. Represents the ontological identity of this thematic classification, serving as the key for interoperability, ontology mapping, and semantic web integration.
          minLength: 1
          example: urn:lex:br:federal:tema:previdencia-social
        url:
          type: string
          format: uri
          nullable: true
          description: The canonical electronic address (Dereferenceable URI) pointing to the official definition or documentation of this Theme. This field is used for human reference and external system integration.
          minLength: 1
          example: https://normas.leg.br/temas/previdencia-social
        label:
          type: string
          description: The human-readable name or label for the theme.
          example: Social Security
        parentIds:
          type: array
          nullable: true
          description: An optional list of IDs of broader themes in the taxonomy. A theme can have multiple parents to support poly-hierarchical classification.
          items:
            $ref: '#/components/schemas/ID'
          example:
            - urn:lex:br:federal:tema:direito.publico
        childrenIds:
          type: array
          nullable: true
          description: An optional list of IDs of more specific themes in the taxonomy.
          items:
            $ref: '#/components/schemas/ID'
          example:
            - urn:lex:br:federal:tema:pensoes
            - urn:lex:br:federal:tema:saude
        metadata:
          $ref: '#/components/schemas/JSON'
          nullable: true
          description: |-
            A flexible field for any valid JSON data. Used for storing structured properties of the theme, such as scope, domain-specific attributes, or additional classification information that doesn't fit into other fields.

            **Best Practice:** Use schema.org vocabularies (e.g., schema.org/DefinedTerm) to enable semantic interoperability. See [Metadata Best Practices](../../docs/METADATA_BEST_PRACTICES.md) for guidance on structuring thematic metadata.
    ItemType:
      type: object
      description: |
        Represents a classification type in the Item taxonomy. ItemTypes form a poly-hierarchical structure that defines the formal type system for Items. For example, in the legal domain, "Article" is a type of "Component" and can contain "Caput" and "Paragraph".
        ItemTypes enable: - Validation of Item hierarchies (e.g., an Article can only contain Paragraphs) - Rich metadata about types (icons, levels, constraints) - Multilingual descriptions via associated TextUnits (using aspects like 'description', 'summary') - Discovery and navigation of the type system
        **Usage Across Domains:**
        While originally designed for legislative structure (Articles, Paragraphs, etc.), ItemTypes also support judicial and case law modeling:
        - **Legislative Types**: Constitution, Law, Article, Paragraph, Inciso, Alinea - **Judicial Types**: Judgment, Overruling, Distinguishing, Constitutional Mutation - **Judgment Components**: Voto do Relator, Ementa, Relatório, Dispositivo - **Common Law Types**: Opinion, Majority Opinion, Dissenting Opinion, Concurring Opinion
        This allows a unified taxonomic approach across both statutory text and judicial precedents.
      required:
        - id
        - label
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: 'The primary, opaque identifier for this ItemType. The field is a string with no format restriction, allowing each implementation to choose the most appropriate strategy: UUIDs for distributed systems, deterministic hashes, or semantic identifiers. In the examples of this specification, the id field is populated with a semantic identifier (e.g., "article") to facilitate reading.'
          example: article
        urn:
          type: string
          nullable: true
          description: The persistent semantic identifier in URN format for this ItemType. Represents the ontological identity of this type classification, serving as the key for interoperability and semantic web integration.
          minLength: 1
          example: urn:lex:br:federal:tipo-dispositivo:artigo
        url:
          type: string
          format: uri
          nullable: true
          description: The canonical electronic address (Dereferenceable URI) pointing to the official definition or documentation of this ItemType. This field is used for human reference and external system integration.
          minLength: 1
          example: https://normas.leg.br/?urn=urn:lex:br:federal:tipo-dispositivo:artigo
        label:
          type: string
          description: The human-readable name or label for this type.
          minLength: 1
          example: Article
        parentIds:
          type: array
          nullable: true
          description: An optional list of IDs of broader types in the taxonomy. An ItemType can have multiple parents to support poly-hierarchical classification (e.g., "Legal Provision" might be both a "Work Concept" and a "Normative Content").
          items:
            $ref: '#/components/schemas/ID'
          example:
            - component
        childrenIds:
          type: array
          nullable: true
          description: An optional list of IDs of more specific types in the taxonomy (Is-A hierarchy). Represents specialization relationships.
          items:
            $ref: '#/components/schemas/ID'
        allowedPartsIds:
          type: array
          nullable: true
          description: An optional list of IDs of ItemTypes that are allowed as structural parts within instances of this ItemType. This defines composition rules (Allowed-Part-Of dimension), separate from taxonomic relationships. For example, "Article" might allow "Caput" and "Paragraph" as parts, but not "Chapter" or "Section".
          items:
            $ref: '#/components/schemas/ID'
          example:
            - paragraph
            - inciso
            - alinea
        metadata:
          $ref: '#/components/schemas/JSON'
          nullable: true
          description: |-
            A flexible field for any valid JSON data. Used for storing type-specific properties such as validation rules, UI hints, structural constraints, or other domain-specific attributes.
            Examples: - Validation rules: which types can contain which other types - UI hints: icons, colors, display order - Structural constraints: max depth, numbering schemes - Legal semantics: normative weight, citation formats
          example:
            level: 2
            icon: 📄
    TextUnit:
      type: object
      description: |
        Represents a concrete piece of textual information. It is a flexible object used to hold any aspect of text associated with a primary entity in the graph.
      required:
        - id
        - sourceType
        - sourceId
        - language
        - aspect
        - content
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: A unique identifier for this specific piece of text.
          example: urn:lex:br:federal:constituicao:1988@1988-10-05~text;pt!art1_par1
        sourceType:
          type: string
          description: The type of the source node in the graph to which this text is attached. This provides essential context for the retrieved text.
          enum:
            - Theme
            - Item
            - Version
            - Action
            - Relation
          example: Version
        sourceId:
          $ref: '#/components/schemas/ID'
          description: The unique ID of the source node.
          example: urn:lex:br:federal:constituicao:1988@1988-10-05!art1_par1
        language:
          type: string
          description: The language of the content, specified as an IETF BCP 47 tag.
          pattern: ^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]+)*$
          example: pt-BR
        aspect:
          type: string
          minLength: 1
          description: |-
            The deployment-defined semantic role of this TextUnit relative to its source node. Aspect vocabularies are implementation- and domain-specific; consumers can discover supported values and their meanings through `getSupportedTextUnitAspects`.
            For example, a legal-domain implementation may define aspects such as `canonical` for primary official text, `summary` for a condensed description, `indexical` for alternative identifiers or names, and `ratio`, `facts`, or `holding` for case-law material.
          example: canonical
        content:
          type: string
          minLength: 1
          description: The textual content of this unit. How content is segmented, normalized, contextualized, generated, or otherwise materialized is implementation- and domain-specific and may vary by `aspect`. The API does not prescribe those materialization conventions. Consumers should consult the implementation's documentation for the conventions applicable to each aspect. Unit-specific information may be provided in `metadata`.
          example: Todo o poder emana do povo, que o exerce por meio de representantes eleitos ou diretamente, nos termos desta Constituição.
        metadata:
          $ref: '#/components/schemas/JSON'
          nullable: true
          description: |-
            A flexible field for any valid JSON data providing structured or additional metadata about this TextUnit. When a TextUnit represents an aspect of a Theme or Item (e.g., its description or summary), this field can optionally contain its structured representation alongside the natural language textual representation in the `content` property.

            **Best Practice:** Use internationally recognized vocabularies such as schema.org to enable semantic interoperability. See [Metadata Best Practices](../../docs/METADATA_BEST_PRACTICES.md) for guidance on structuring text unit metadata.
    Action:
      type: object
      description: |
        Represents a reified event that records a causal state transition in the graph. An Action connects one or more source Versions, when available, to Versions it terminates and/or produces. Deployments define the Action vocabulary and the domain semantics associated with those transitions.
        In the legal reference domain, Actions may represent legislative or judicial events such as amendments, enactments, revocations, interpretations, or overrulings.
      required:
        - id
        - type
        - eventTime
        - sourceVersionIds
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: A unique identifier for this specific Action.
          example: urn:lex:br:federal:emenda.constitucional:2000-02-14;26@2000-02-14!art1_cpt_alt1_art6_cpt
        parentId:
          $ref: '#/components/schemas/ID'
          nullable: true
          description: |-
            The ID of the parent Action when this Action forms part of a larger event. This supports deployment-defined macro/micro event decomposition.
            In the legal reference domain, a promulgation may be represented as a macro-event containing atomic amendment Actions as children.
          example: urn:lex:br:federal:emenda.constitucional:2000-02-14;26@2000-02-14
        type:
          type: string
          description: |-
            The deployment-defined Action-type value. Consumers can discover supported values and their meanings through `getSupportedActionTypes`.
            For example, a legal-domain implementation may define values such as `Amendment`, `Revocation`, `Creation`, `Interpretation`, `Overruling`, or `Distinguishing`.
          example: INSERTION
        eventTime:
          type: string
          format: date-time
          description: The date and time associated with this Action, in UTC.
          example: '2000-02-14T00:00:00Z'
        validityInterval:
          $ref: '#/components/schemas/TimeInterval'
          nullable: true
          description: An optional validity interval associated with this Action according to the deployment's temporal model. Its exact domain interpretation is implementation-specific.
        applicabilityInterval:
          $ref: '#/components/schemas/TimeInterval'
          nullable: true
          description: An optional applicability or effectiveness interval associated with this Action according to the deployment's domain semantics.
        sourceVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: |-
            The IDs of Version objects that provide source or provenance for this Action. The array may be empty when source provenance is unavailable or has not been linked.
            In the legal reference domain, these may identify legislative provisions or decision components that authorize, explain, or support the modeled event.
          example:
            - urn:lex:br:federal:supremo.tribunal.federal:acordao:2016-02-17;hc126292@2016-02-17!majority_opinion
        terminatesVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: The IDs of Version objects whose validity or active state is terminated by this Action. The array may be empty when the Action does not terminate an existing Version.
          example:
            - urn:lex:br:federal:constituicao:1988-10-05;1988@1988-10-05!art6_cpt
        producesVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: The IDs of Version objects produced by this Action. The array may be empty when the Action does not create a new Version.
          example:
            - urn:lex:br:federal:constituicao:1988-10-05;1988@2000-02-14!art6_cpt
        metadata:
          $ref: '#/components/schemas/JSON'
          nullable: true
          description: A flexible field for valid JSON data providing additional context about the Action. Deployments may use domain vocabularies appropriate to their application. In the legal reference domain, schema.org vocabularies may be useful for interoperability.
    Relation:
      type: object
      description: |
        Represents a directed, typed, and potentially time-bound link between two entities in the graph (Items or Versions). This polymorphic design allows for modeling a rich web of interactions, distinguishing between timeless conceptual links and time-bound references. The optional `validityInterval` allows relationships that are only true for a specific period.
      required:
        - id
        - sourceType
        - sourceId
        - predicate
        - targetType
        - targetId
      properties:
        id:
          $ref: '#/components/schemas/ID'
          description: A unique identifier for this specific relation instance.
        sourceType:
          type: string
          description: The type of the entity at the source of the relation.
          enum:
            - Item
            - Version
          example: Item
        sourceId:
          $ref: '#/components/schemas/ID'
          description: The ID of the source entity.
          example: urn:lex:br:federal:constituicao:1988-10-05;1988
        predicate:
          type: string
          minLength: 1
          description: |-
            The deployment-defined predicate that gives this relationship its semantics. Predicate vocabularies are implementation- and domain-specific; consumers can discover supported values and their meanings through `getSupportedRelationPredicates`.
            For example, a legal-domain implementation may define predicates such as `cites`, `succeeds`, `appliesTo`, `definedIn`, or `relatedTo`.
          example: cites
        targetType:
          type: string
          description: The type of the entity at the target of the relation.
          enum:
            - Item
            - Version
          example: Item
        targetId:
          $ref: '#/components/schemas/ID'
          description: The ID of the target entity.
          example: urn:lex:br:federal:constituicao:1967-01-24;1967
        validityInterval:
          $ref: '#/components/schemas/TimeInterval'
          nullable: true
          description: The time interval during which this relation is valid. If null, the relation is considered atemporal.
          example:
            - '2020-03-15T00:00:00Z'
            - '2020-09-15T23:59:59Z'
        metadata:
          $ref: '#/components/schemas/JSON'
          nullable: true
          description: |-
            A flexible field for any valid JSON data providing more context about the relation, such as source, confidence, or other domain-specific attributes.
            **Best Practice:** Use schema.org vocabularies to enable semantic interoperability. See [Metadata Best Practices](../../docs/METADATA_BEST_PRACTICES.md) for guidance on structuring relationship metadata.
    SearchItemsRequest:
      type: object
      description: |
        The request body for the searchItems operation.

        **Structural Scoping — `itemIds` vs `itemUrns`:**
        Both filters define hierarchical structural scope. `itemIds` uses deployment
        identifiers. `itemUrns` is available to deployments whose semantic URN scheme
        supports structural identification or hierarchical scoping. The traversal and
        optimization mechanism are implementation-specific. In the legal reference
        domain, LEX URNs are one example.
      properties:
        itemIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: |
            Optional. A list of Item IDs treated as roots of a hierarchical structural scope.
          example:
            - urn:lex:br:federal:lei:2002-01-10;10406
            - urn:lex:br:federal:lei:1973-10-10;6015
        itemUrns:
          type: array
          items:
            type: string
          description: |
            Optional. Semantic URNs treated as roots of a hierarchical structural scope
            when the deployment's URN scheme supports that behavior. The identifier scheme
            and traversal mechanism are implementation-specific; LEX URNs are a legal-domain example.
          example:
            - urn:lex:br:federal:lei:2002-01-10;10406
            - urn:lex:br:federal:lei:1973-10-10;6015
        themeIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: Optional. A list of Theme IDs to expand the search scope.
        itemTypeIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: |
            Optional. Filter search results to only Items of the specified types.
          example:
            - item-type:article
            - item-type:paragraph
        itemMetadataFilter:
          $ref: '#/components/schemas/ItemMetadataFilterSchema'
        contentQuery:
          $ref: '#/components/schemas/ContentQuery'
        topK:
          type: integer
          format: int32
          default: 10
          minimum: 1
          description: The maximum number of results to return.
        dataSources:
          $ref: '#/components/schemas/DataSourcesSchema'
    SearchTextUnitsRequest:
      type: object
      description: |
        The request body for the searchTextUnits operation.

        This endpoint performs **semantic and lexical discovery** within a defined scope. All search strategies, including `lexicalOnly`, are ranked discovery strategies and do not guarantee exhaustive enumeration of all matching TextUnits. For deterministic fetching of TextUnits by specific Version IDs, use `getBatchTextUnits` instead.

        For exhaustive inspection of a known Version scope, explicitly enumerate that scope, retrieve its TextUnits with `getBatchTextUnits`, and evaluate the desired criterion over the complete retrieved set.

        **Scoping:**
        - Use `itemIds` and/or `themeIds` to define structural or thematic scope.
        - Use `versionIds` to restrict ranked search to an exact set of Versions.
        - Use `at` to constrain temporally; if omitted, no temporal filter is applied.
        - Use `temporalPredicate` to select validity or applicability when `at` is provided.
        - If none of `itemIds`, `itemUrns`, `versionIds`, or `themeIds` is provided, the search applies globally across accessible data.
        - Multiple scope filters are intersected.

        **Structural Scoping — `itemIds` vs `itemUrns`:**
        Both filters define hierarchical structural scope. `itemIds` uses deployment identifiers.
        `itemUrns` is available to deployments whose semantic URN scheme supports structural
        identification or hierarchical scoping. The traversal and optimization mechanism are
        implementation-specific. In the legal reference domain, LEX URNs are one example.

        **Version Scoping:**
        `versionIds` defines an exact Version scope and performs no hierarchical expansion.

        **Temporal Filtering:**
        - If `at` is omitted, no temporal filter is applied.
        - If `at` is provided and `temporalPredicate` is omitted, `validity` is used.
        - `validity` filters by `validityInterval`.
        - `applicability` filters by `applicabilityInterval`; if absent, the implementation MUST fall back to `validityInterval`, matching `getApplicableVersions`.
        - Supplying `temporalPredicate` without `at` is invalid and MUST result in HTTP 400.
        - Ranked search uses the current transaction-time perspective; `observerTime` is not part of this operation.
      properties:
        itemIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: |
            Optional. Item IDs treated as roots of a hierarchical structural scope.
          example:
            - urn:lex:br:federal:lei:2002-01-10;10406
        itemUrns:
          type: array
          items:
            type: string
          description: |
            Optional. Semantic URNs treated as roots of a hierarchical structural scope
            when the deployment's URN scheme supports that behavior. The identifier scheme
            and traversal mechanism are implementation-specific; LEX URNs are a legal-domain example.
          example:
            - urn:lex:br:federal:lei:2002-01-10;10406
        versionIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          minItems: 1
          uniqueItems: true
          description: |
            Optional. Exact Version IDs defining the ranked-search candidate universe.
            No hierarchical expansion is performed. When combined with other filters,
            all constraints are intersected.
        itemTypeIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: Optional. Restricts results to TextUnits associated with Items of the specified types.
        themeIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: Optional. Theme IDs defining thematic scope.
        metadataFilter:
          $ref: '#/components/schemas/MetadataFilter'
        at:
          type: string
          format: date-time
          description: |
            Optional. UTC date-time at which to apply the selected temporal predicate.
            If omitted, no temporal filter is applied.
        temporalPredicate:
          type: string
          enum:
            - validity
            - applicability
          default: validity
          description: |
            Optional. Selects the temporal predicate used when `at` is provided.
            Supplying this parameter without `at` is invalid and MUST result in HTTP 400.
        contentQuery:
          $ref: '#/components/schemas/ContentQuery'
        language:
          type: string
          description: The IETF BCP 47 language code for the content.
          example: pt-BR
        aspects:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
          description: Optional. Restricts ranked search to the specified deployment-defined TextUnit aspects. If omitted, all available aspects are considered. Supported values and their meanings can be discovered through `getSupportedTextUnitAspects`.
          example:
            - canonical
            - summary
        topK:
          type: integer
          format: int32
          default: 10
          minimum: 1
          description: |
            The maximum number of ranked results to return. Increasing `topK` does not convert
            this operation into exhaustive enumeration.
        dataSources:
          $ref: '#/components/schemas/DataSourcesSchema'
          description: Optional. Scopes the search to a specific list of granted data sources.
    GetRelationsRequest:
      type: object
      description: Specifies the criteria for querying Relation objects. If 'entityId' is omitted, the query runs against the entire corpus of relations.
      properties:
        entityId:
          $ref: '#/components/schemas/ID'
          description: Optional. The ID of an anchor entity. If provided, 'entityType' is required.
        entityType:
          type: string
          description: Optional. The type of the anchor entity. Required only if 'entityId' is provided.
          enum:
            - Item
            - Version
        predicate:
          type: string
          description: Optional. Filters relations by a specific predicate (e.g., 'cites').
        direction:
          type: string
          description: Specifies the direction of the relations to retrieve relative to the 'entityId'.
          enum:
            - forward
            - backward
            - both
          default: both
        validityIntervalFilter:
          type: object
          description: Optional. Filters relations to those whose validity interval overlaps with the specified interval.
          properties:
            startTime:
              type: string
              format: date-time
            endTime:
              type: string
              format: date-time
        metadataFilter:
          type: object
          additionalProperties: true
          description: Optional. Key-value pairs to filter against the 'metadata' of the Relation.
        dataSources:
          $ref: '#/components/schemas/DataSourcesSchema'
    GetActionsRequest:
      type: object
      description: Specifies the criteria for querying Action objects. If all optional filters are omitted, the query runs against the entire corpus of actions.
      properties:
        itemIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: Optional. A list of Item IDs. Returns actions that affected any of these items.
        sourceVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: Optional. A list of source Version IDs. Returns actions authorized by any of these versions.
        producesVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: Optional. A list of Version IDs. Returns actions that produced any of these versions.
        terminatesVersionIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: Optional. A list of Version IDs. Returns actions that terminated any of these versions.
        actionTypes:
          type: array
          items:
            type: string
          description: Optional. Filters by deployment-defined values returned by getSupportedActionTypes.
        startTime:
          type: string
          format: date-time
          description: Optional. Includes actions with eventTime greater than or equal to this instant.
        endTime:
          type: string
          format: date-time
          description: Optional. Includes actions with eventTime less than or equal to this instant.
        granularity:
          type: string
          enum:
            - macro
            - micro
          description: 'Optional. Filters Actions by hierarchical granularity level. - ''macro'': Returns only top-level macro-events (parentId = null). - ''micro'': Returns only atomic micro-events (parentId != null). - If omitted, returns both macro and micro-events.'
        timeInterval:
          type: object
          description: Optional but recommended. Filters actions by their effective date. At least one of 'startTime' or 'endTime' should be provided.
          properties:
            startTime:
              type: string
              format: date-time
              description: Optional. Includes actions with eventTime >= startTime.
            endTime:
              type: string
              format: date-time
              description: Optional. Includes actions with eventTime <= endTime.
        dataSources:
          $ref: '#/components/schemas/DataSourcesSchema'
          description: Optional. Restricts results to specified data sources.
    GetBatchActionsRequest:
      type: object
      description: Specifies the criteria for retrieving a batch of Action objects.
      required:
        - ids
      properties:
        ids:
          type: array
          description: A list of unique identifiers for the Actions to retrieve.
          items:
            $ref: '#/components/schemas/ID'
          minItems: 1
          uniqueItems: true
    GetBatchItemsRequest:
      type: object
      description: Specifies the criteria for retrieving a batch of Item objects.
      required:
        - ids
      properties:
        ids:
          type: array
          description: A list of canonical IDs for the Items to retrieve.
          items:
            $ref: '#/components/schemas/ID'
          minItems: 1
          uniqueItems: true
    GetBatchVersionsRequest:
      type: object
      description: Specifies the criteria for retrieving a batch of Version objects by their IDs.
      required:
        - ids
      properties:
        ids:
          type: array
          description: A list of canonical IDs for the Versions to retrieve.
          items:
            $ref: '#/components/schemas/ID'
          minItems: 1
          uniqueItems: true
    GetBatchValidVersionsRequest:
      type: object
      description: Specifies the criteria for retrieving a batch of valid Version objects.
      required:
        - itemIds
        - at
      properties:
        itemIds:
          type: array
          description: A list of canonical IDs for the Items whose valid versions are requested.
          items:
            $ref: '#/components/schemas/ID'
          minItems: 1
          uniqueItems: true
        at:
          type: string
          format: date-time
          description: The specific UTC date-time for which to check validity for all items (Valid Time).
        observerTime:
          type: string
          format: date-time
          description: Optional. The transaction-time perspective from which to view the graph. Only facts known or recorded by the system at or before this perspective may affect the result. This is distinct from the event time or valid time of those facts. If omitted, defaults to "now" (the current recorded knowledge perspective).
    GetBatchTextUnitsRequest:
      type: object
      description: Specifies the criteria for retrieving a batch of TextUnit objects by Version IDs.
      required:
        - versionIds
        - language
      properties:
        versionIds:
          type: array
          description: A list of identifiers for the Versions of interest.
          items:
            $ref: '#/components/schemas/ID'
          minItems: 1
          uniqueItems: true
        language:
          type: string
          description: The language code to retrieve (e.g., 'pt-br', 'en').
          pattern: ^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]+)*$
          example: pt-br
        aspects:
          type: array
          description: |
            Optional. Restricts retrieval to the specified deployment-defined TextUnit
            aspects. If omitted, all available aspects are returned. Supported values
            and their meanings can be discovered through `getSupportedTextUnitAspects`.
          items:
            type: string
          minItems: 1
          uniqueItems: true
          example:
            - canonical
            - summary
    GetBatchItemTypesRequest:
      type: object
      description: Specifies the criteria for retrieving a batch of ItemType objects.
      required:
        - ids
      properties:
        ids:
          type: array
          description: A list of canonical IDs for the ItemTypes to retrieve.
          items:
            $ref: '#/components/schemas/ID'
          minItems: 1
          uniqueItems: true
    ResolvedItemCandidate:
      type: object
      description: Represents a single candidate match when resolving a text reference to an Item, including the full entity and a normalized confidence signal.
      required:
        - item
        - confidence
      properties:
        item:
          $ref: '#/components/schemas/Item'
          description: The matched Item entity.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: A normalized, implementation-specific confidence signal used to rank candidates within this resolution result. It MUST NOT be interpreted as a calibrated probability or certainty measure. Comparability across different queries, deployments, or implementation states is not guaranteed unless explicitly documented.
          example: 0.95
    ResolvedThemeCandidate:
      type: object
      description: Represents a single candidate match when resolving a text reference to a Theme, including the full entity and a normalized confidence signal.
      required:
        - theme
        - confidence
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
          description: The matched Theme entity.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: A normalized, implementation-specific confidence signal used to rank candidates within this resolution result. It MUST NOT be interpreted as a calibrated probability or certainty measure. Comparability across different queries, deployments, or implementation states is not guaranteed unless explicitly documented.
          example: 0.95
    ResolvedItemTypeCandidate:
      type: object
      description: Represents a single candidate match when resolving a text reference to an ItemType, including the full entity and a normalized confidence signal.
      required:
        - itemType
        - confidence
      properties:
        itemType:
          $ref: '#/components/schemas/ItemType'
          description: The matched ItemType entity.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: A normalized, implementation-specific confidence signal used to rank candidates within this resolution result. It MUST NOT be interpreted as a calibrated probability or certainty measure. Comparability across different queries, deployments, or implementation states is not guaranteed unless explicitly documented.
          example: 0.95
    SearchedTextUnitResult:
      type: object
      description: Represents a single search result, containing a TextUnit and its normalized ranking score.
      required:
        - textUnit
        - score
      properties:
        textUnit:
          $ref: '#/components/schemas/TextUnit'
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: A normalized, implementation-specific ranking signal for this search result. It MUST NOT be interpreted as a probability or calibrated certainty measure. The value is suitable for ordering results within the response in which it is returned. Comparability across different queries, scopes, partitions, deployments, or implementation states is not guaranteed unless explicitly documented.
    SearchedItemResult:
      type: object
      description: Represents a single search result, containing an Item and its normalized ranking score.
      required:
        - item
        - score
      properties:
        item:
          $ref: '#/components/schemas/Item'
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: A normalized, implementation-specific ranking signal for this search result. It MUST NOT be interpreted as a probability or calibrated certainty measure. The value is suitable for ordering results within the response in which it is returned. Comparability across different queries, scopes, partitions, deployments, or implementation states is not guaranteed unless explicitly documented.
    ErrorResponse:
      type: object
      description: A standard format for error responses.
      properties:
        code:
          type: string
          description: An internal, machine-readable error code.
          example: FORBIDDEN_DATASOURCE
        message:
          type: string
          description: A human-readable description of the error.
          example: The provided API Key does not have access to the 'dataSource_STF' data source.
    CausalityTrace:
      type: object
      description: An object containing the specific Actions that created and (optionally) terminated a Version.
      required:
        - creatingAction
      properties:
        creatingAction:
          $ref: '#/components/schemas/Action'
          description: The Action that brought this Version into existence (its provenance).
        terminatingAction:
          $ref: '#/components/schemas/Action'
          nullable: true
          description: The Action that terminated the validity of this Version. This will be null if the Version is still valid.
    HierarchyResponse:
      type: object
      required:
        - rootId
        - descendantIds
      properties:
        rootId:
          $ref: '#/components/schemas/ID'
          description: The ID of the root entity (ItemType or Theme) for which hierarchy was requested.
        descendantIds:
          type: array
          items:
            $ref: '#/components/schemas/ID'
          description: |-
            A flat list of all descendant IDs in the hierarchy, including the rootId itself. This list includes all direct children, grandchildren, and deeper descendants.
            The order is not guaranteed to follow any specific traversal pattern (depth-first or breadth-first). Clients should treat this as an unordered set of IDs.
            **Use Case:** This list is designed to be passed directly to filter parameters in search or retrieval operations (e.g., `searchItems(itemTypeIds=[...])` or `searchItems(themeIds=[...])`).
          example:
            - item-type:normative-component
            - item-type:article
            - item-type:paragraph
            - item-type:clause
            - item-type:item
            - item-type:subitem
      description: Response containing a flat list of all descendant IDs for a given hierarchy node (ItemType or Theme). Used for hierarchical filtering in search operations.
  parameters:
    DataSourcesParameter:
      name: dataSources
      in: query
      required: false
      description: |
        **Optional.** A list of identifiers for the DataSources to scope the search.
        The API will only return results from DataSources that are both requested here
        and granted to the current credential. If omitted, all granted DataSources are used.
      schema:
        type: array
        items:
          type: string
        uniqueItems: true
      example:
        - dataSource_A
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        API-key authentication used by this OpenAPI profile.
        Example: `Authorization: YOUR_API_KEY`
  responses:
    BadRequest:
      description: Bad Request - The request is missing a required parameter, includes an invalid parameter value, or is otherwise malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_PARAMETER
            message: The 'topK' parameter must be a positive integer.
    Unauthorized:
      description: Unauthorized - The request lacks valid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: Authentication credentials were not provided or are invalid.
    Forbidden:
      description: Forbidden - The request is authenticated but access to the requested resource or data source is denied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN_DATASOURCE
            message: The credential does not have access to the requested data source.
    NotFound:
      description: Not Found - The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
            message: No resource found with the specified ID.
security:
  - ApiKeyAuth: []
paths:
  /items/by-reference:
    get:
      tags:
        - Discovery and Search Actions
      summary: Resolve a text reference to a ranked list of Item candidates.
      operationId: resolveItemReference
      description: |
        Translates an ambiguous, natural-language reference to an entity into a **ranked list of candidate** `Item` objects.
        This is the critical first step for any query that names a specific entity (a document component, a concept, a named entity, etc.), acting as the bridge between user language and the graph's formal identifiers.

        ### Discussion
        This action is indispensable for grounding agentic workflows. References are often highly ambiguous ("Article 1") or relative ("the following paragraph").
        This function handles this by returning a ranked list of candidates rather than forcing a single, potentially incorrect guess.
        The optional `contextId` parameter significantly enhances its precision for context-aware interactions.
      x-sat-graph-agent:
        version: 1
        when-to-use: 'First step of any referential plan: turn a textual reference or URN into a canonical itemId before temporal, structural, or causal navigation.'
        not-for: Thematic questions with no explicit reference (use searchTextUnits/searchItems); structural class names like "Article" (use resolveItemTypeReference).
        pairs-with:
          - getValidVersions
          - getItemVersions
          - getItemChildren
          - getItemAncestors
        caveats: Returns confidence-scored candidates; if confidence is low or several are close, disambiguate before deterministic traversal.
        role: anchor
      security:
        - ApiKeyAuth: []
      parameters:
        - name: referenceText
          in: query
          required: true
