  /text-units/search:
    post:
      tags:
        - Discovery and Search Actions
      summary: Performs a hybrid search for TextUnits.
      operationId: searchTextUnits
      description: |
        Performs a hybrid search to discover `TextUnit` nodes by combining semantic, lexical, and structured criteria, returning a ranked list of the most relevant results. This is the primary, optimized entry point for all standard RAG queries.

        All search strategies exposed through this operation, including `lexicalOnly`, are ranked discovery strategies. This operation does not guarantee exhaustive enumeration of all lexical matches.

        ### Scoping
        Define the search scope using:
        - `itemIds` and/or `itemUrns` for structural boundaries (hierarchical traversal — all descendants of the provided items are included; prefer `itemUrns` for LEX URN implementations)
        - `versionIds` for an exact Version scope, with no hierarchical expansion
        - `themeIds` for thematic boundaries
        - `at` for temporal constraints; if omitted, no temporal filter is applied
        - `temporalPredicate` to choose formal validity or material applicability when `at` is provided
        - Omit all scope filters to search globally across accessible data

        When multiple scope filters are supplied, they are intersected.

        ### Historically Exact Structural Search
        `versionIds` allows ranked search over an exact historical substructure. A typical workflow is:
        1. resolve the container Version at reference time `t`;
        2. call `getVersionHierarchy` to enumerate descendant Version IDs;
        3. include the root Version ID when needed;
        4. call `searchTextUnits` with those `versionIds`.

        This preserves the existing semantics of `itemIds`, `itemUrns`, and `at`: Item-based scoping remains atemporal structural scoping, while Version-based scoping is explicit.

        ### Temporal Filtering
        If `at` is omitted, no temporal filter is applied. If `at` is provided and `temporalPredicate` is omitted, the search uses `validity`.

        - `validity` filters by each Version's `validityInterval`.
        - `applicability` filters by `applicabilityInterval`; if a Version has no explicit applicability interval, the implementation falls back to `validityInterval`, matching `getApplicableVersions`.
        - Supplying `temporalPredicate` without `at` is invalid and returns HTTP 400.
        - This operation uses the graph's current legal truth. Transaction-time projection via `observerTime` is not supported by ranked TextUnit search.

        ### Deterministic Retrieval and Exhaustive Inspection
        **Important:** `versionIds` scopes a ranked search; it does not make the search deterministic. If you already have specific Version IDs and want deterministic retrieval rather than ranking, use `getBatchTextUnits` instead. That endpoint is optimized for bulk retrieval without search overhead.

        For exhaustive inspection of a known Version scope, enumerate that scope explicitly (for example with `getVersionHierarchy`), retrieve the corresponding TextUnits with `getBatchTextUnits`, and evaluate the desired criterion over the complete retrieved set. Exhaustiveness comes from explicit control of the admissible universe, not from increasing `topK` or selecting `lexicalOnly`.

        ### Filtering and Aspects
        Additional optional filters like `itemTypeIds` can further narrow results to specific structural components, enabling use cases such as searching only within articles or specific item hierarchies.

        The `aspects` parameter enables a truly holistic search, allowing a query to match a `Work`'s 'textual_metadata' just as easily as a `Version`'s 'canonical' text.
      x-sat-graph-agent:
        version: 1
        when-to-use: Hybrid semantic+lexical search over TextUnits, including ranked search within an explicit Item, Theme, or Version scope.
        not-for: Exhaustive enumeration of lexical matches or all TextUnits in a known scope — enumerate the scope and use getBatchTextUnits. Deterministic retrieval of known Versions — use getBatchTextUnits.
        pairs-with:
          - resolveThemeReference
          - getVersionHierarchy
          - getBatchTextUnits
          - getItemAncestors
        caveats: Results are scored candidates, not final legal evidence. `versionIds` defines an exact Version scope but does not make ranking deterministic. `lexicalOnly` selects lexical retrieval/ranking and does not guarantee exhaustive coverage. If temporal filtering is required, supply `at`; `temporalPredicate` without `at` is invalid. Ranked search uses current legal truth and does not expose `observerTime`.
        role: search
      security:
        - ApiKeyAuth: []
      requestBody:
        description: The search criteria.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTextUnitsRequest'
      responses:
        '200':
          description: Search executed successfully. Returns a ranked list of TextUnits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchedTextUnitResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
