  /query-actions:
    post:
      tags:
        - Causal Analysis Actions
      summary: Queries for Action objects based on complex criteria including items, versions, types, and temporal filters.
      operationId: queryActions
      description: |
        A powerful action to query and retrieve complete `Action` objects based on a variety of criteria, including affected items, produced versions, action types, and temporal validity.

        This action enables efficient batch retrieval of actions across multiple items and versions, supporting complex impact analysis workflows without needing to call per-item endpoints repeatedly.

        ### Filtering Logic

        The identity fields form one alternative-anchor group:

        - **itemIds**: matches Actions that produced or terminated a Version of any specified Item.
        - **sourceVersionIds**: matches Actions authorized by any specified source Version.
        - **producesVersionIds**: matches Actions that produced any specified Version.
        - **terminatesVersionIds**: matches Actions that terminated any specified Version.

        An Action that matches **any** populated identity field is inside the identity
        scope (`itemIds OR sourceVersionIds OR producesVersionIds OR
        terminatesVersionIds`). If no identity field is populated, the identity scope
        is the whole corpus.

        The remaining filters narrow that scope conjunctively:

        - **actionTypes**: keeps only Actions of any specified type.
        - **startTime/endTime** (or **timeInterval**): keep only Actions whose
          `eventTime` falls within the requested bounds.
        - **granularity**: keeps only the requested macro- or micro-event level.

        Therefore, different filter families combine with **AND**:
        `(identity scope) AND actionTypes AND time bounds AND granularity`.

        ### Discussion

        This action is essential for comprehensive impact analysis at scale. Rather than making individual `/items/{itemId}/history` or `/items/{sourceWorkId}/actions-caused` calls, a single `/query-actions` call can retrieve all relevant actions across multiple items and versions, dramatically improving efficiency for temporal and causal analysis workflows.
      x-sat-graph-agent:
        version: 1
        when-to-use: 'Structured impact analysis at scale: filter Actions jointly by items, versions, types, and time.'
        not-for: Single-item history — use getItemHistory. A single source act — use getActionsBySource.
        pairs-with:
          - getSupportedActionTypes
          - getBatchVersions
        role: causal
      security:
        - ApiKeyAuth: []
      requestBody:
        description: The criteria for the Action query.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetActionsRequest'
      responses:
        '200':
          description: A time-ordered list of Action objects matching the criteria. The list may be empty if no actions are found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
