  /items/{itemId}/hierarchy:
    get:
      tags:
        - Structural Navigation Actions
      summary: Gets all Item IDs within the hierarchy of a given Item.
      operationId: getItemHierarchy
      description: |
        Enumerates and returns **Item IDs** for all items within the structural hierarchy of a specified Item. This is an efficient operation optimized for traversing hierarchies and collecting item references without the overhead of returning full Item objects.

        Item-level navigation is **atemporal**: it traverses the canonical Item hierarchy adopted by the implementation and does not filter descendants by whether they currently have a valid or applicable Version. Revocation, repeal, expiration, or the absence of a currently valid/applicable Version does not by itself remove an Item from this traversal.

        Historical structural position is not reconstructed by this operation. Use Version-level navigation (`getVersionChildren`, `getVersionHierarchy`, `getVersionParents`, `getVersionAncestors`) when the structure of a specific Version state is required.

        ### Use Cases
        This action is ideal for:
        - Traversing structural hierarchies to collect all descendant IDs
        - Building item ID lists for use in other operations (e.g., `/query-actions`, `search-items`)
        - Efficient batch processing where only IDs are needed
        - Hierarchical navigation with minimal payload overhead

        ### Discussion
        This action's purpose is **structural enumeration and navigation**, not search filtering or temporal resolution. It is the correct tool for tasks like collecting all Items in a canonical subtree for further processing. For performing content-based searches within a scope, agents should pass the scope's ID directly to the search functions (`searchTextUnits`, `searchItems`), as this is significantly more performant.

