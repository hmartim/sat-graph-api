  /items/{sourceWorkId}/actions-caused:
    get:
      tags:
        - Causal Analysis Actions
      summary: Retrieves all Actions caused by a specific source Work.
      operationId: getActionsBySource
      description: |
        An essential action for impact analysis that provides forward causal tracing. Given the ID of a source `Work` (e.g., an amending law), it retrieves all atomic `Action`s authorized by any clause within that Work.

        The returned list is ordered chronologically by the action's effective date.

        ### Discussion
        This action is the logical inverse of `traceCausality`. It traces forwards from a high-level cause to all of its granular effects, answering the critical question: "What did Law X do?".
      x-sat-graph-agent:
        version: 1
        when-to-use: 'Forward causality: starting from a source Work (an amending act, a complementary law), list the Actions it caused.'
        not-for: Retrospective "what changed this provision" — use getItemHistory.
        pairs-with:
          - resolveItemReference
          - getBatchVersions
          - getItemAncestors
        caveats: A source Work may cause hundreds of atomic Actions. For a bounded question, scope by targetRootItemId, targetItemTypeIds, and actionTypes before hydrating produced or terminated Versions.
        role: causal
      security:
        - ApiKeyAuth: []
      parameters:
        - name: sourceWorkId
          in: path
          required: true
          description: The canonical ID of the source 'Work' (e.g., an amending law).
          schema:
            $ref: '#/components/schemas/ID'
        - name: actionTypes
          in: query
          required: false
          description: Optional. Filters by deployment-defined values returned by getSupportedActionTypes.
          schema:
            type: array
            items:
              type: string
        - name: granularity
          in: query
          required: false
          description: |-
            Optional. Filters Actions by hierarchical granularity level. - 'macro': Returns only top-level macro-events (parentId = null), representing global
              legislative acts (e.g., "Promulgation of Constitutional Amendment 26/2000").
            - 'micro': Returns only atomic micro-events (parentId != null), representing specific
              transformations (e.g., "Art. 1 of CA 26 modifying Art. 6 of the Constitution").
            - If omitted, returns both macro and micro-events.
          schema:
            type: string
            enum:
              - macro
              - micro
          example: micro
        - name: targetRootItemId
          in: query
          required: false
          description: Optional. Keeps only Actions that produce or terminate a Version in the specified target Work/subtree.
          schema:
            $ref: '#/components/schemas/ID'
        - name: targetItemTypeIds
          in: query
          required: false
          description: Optional. Keeps only Actions whose produced or terminated target belongs to one of these structural Item types.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ID'
        - $ref: '#/components/parameters/DataSourcesParameter'
      responses:
        '200':
          description: A time-ordered list of Action objects caused by the specified source. The list may be empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /query-actions:
    post:
      tags:
        - Causal Analysis Actions
      summary: Queries for Action objects based on complex criteria including items, versions, types, and temporal filters.
      operationId: queryActions
      description: |
        A powerful action to query and retrieve complete `Action` objects based on a variety of criteria, including affected items, produced versions, action types, and temporal validity.

        This action enables efficient batch retrieval of actions across multiple items and versions, supporting complex impact analysis workflows without needing to call per-item endpoints repeatedly.

        ### Filtering Logic

        The identity fields form one alternative-anchor group:

        - **itemIds**: matches Actions that produced or terminated a Version of any specified Item.
        - **sourceVersionIds**: matches Actions authorized by any specified source Version.
        - **producesVersionIds**: matches Actions that produced any specified Version.
        - **terminatesVersionIds**: matches Actions that terminated any specified Version.

        An Action that matches **any** populated identity field is inside the identity
        scope (`itemIds OR sourceVersionIds OR producesVersionIds OR
        terminatesVersionIds`). If no identity field is populated, the identity scope
        is the whole corpus.

        The remaining filters narrow that scope conjunctively:

        - **actionTypes**: keeps only Actions of any specified type.
        - **startTime/endTime** (or **timeInterval**): keep only Actions whose
          `eventTime` falls within the requested bounds.
        - **granularity**: keeps only the requested macro- or micro-event level.

        Therefore, different filter families combine with **AND**:
        `(identity scope) AND actionTypes AND time bounds AND granularity`.

        ### Discussion

        This action is essential for comprehensive impact analysis at scale. Rather than making individual `/items/{itemId}/history` or `/items/{sourceWorkId}/actions-caused` calls, a single `/query-actions` call can retrieve all relevant actions across multiple items and versions, dramatically improving efficiency for temporal and causal analysis workflows.
      x-sat-graph-agent:
        version: 1
        when-to-use: 'Structured impact analysis at scale: filter Actions jointly by items, versions, types, and time.'
        not-for: Single-item history — use getItemHistory. A single source act — use getActionsBySource.
        pairs-with:
          - getSupportedActionTypes
          - getBatchVersions
        role: causal
      security:
        - ApiKeyAuth: []
      requestBody:
        description: The criteria for the Action query.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetActionsRequest'
      responses:
        '200':
          description: A time-ordered list of Action objects matching the criteria. The list may be empty if no actions are found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Action'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
