type: object
description: "Represents a single search result, containing a TextUnit and its relevance score."
required:
  - textUnit
  - score
properties:
  textUnit:
    $ref: '../entities/TextUnit.yaml'
  score:
    type: number
    format: float
    description: >-
      An implementation-specific ranking signal for this search result. It MUST NOT
      be interpreted as a probability. Scores are not guaranteed to be comparable
      across different queries, scopes, partitions, implementations, or implementation
      states unless the implementation explicitly documents such comparability.
    minimum: 0.0
    maximum: 1.0
