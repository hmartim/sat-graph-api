type: object
description: "Represents a single search result, containing an Item and its normalized ranking score."
required:
  - item
  - score
properties:
  item:
    $ref: '../entities/Item.yaml'
  score:
    type: number
    format: float
    minimum: 0.0
    maximum: 1.0
    description: >-
      A normalized, implementation-specific ranking signal for this search result.
      It MUST NOT be interpreted as a probability or calibrated certainty measure.
      The value is suitable for ordering results within the response in which it is
      returned. Comparability across different queries, scopes, partitions, deployments,
      or implementation states is not guaranteed unless explicitly documented.
