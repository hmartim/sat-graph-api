#
# OpenAPI 3.x Schema for the 'Action' Data Model
#
# An Action is a reified event that records a causal state transition in the SAT-Graph.
#
type: object
description: >
  Represents a reified event that records a causal state transition in the graph.
  An Action connects one or more source Versions, when available, to Versions it
  terminates and/or produces. Deployments define the Action vocabulary and the
  domain semantics associated with those transitions.

  In the legal reference domain, Actions may represent legislative or judicial
  events such as amendments, enactments, revocations, interpretations, or overrulings.
required:
  - id
  - type
  - eventTime
  - sourceVersionIds
properties:
  id:
    $ref: '../core/ID.yaml'
    description: "A unique identifier for this specific Action."
    example: "urn:lex:br:federal:emenda.constitucional:2000-02-14;26@2000-02-14!art1_cpt_alt1_art6_cpt"
  parentId:
    $ref: '../core/ID.yaml'
    nullable: true
    description: >-
      The ID of the parent Action when this Action forms part of a larger event.
      This supports deployment-defined macro/micro event decomposition.

      In the legal reference domain, a promulgation may be represented as a macro-event
      containing atomic amendment Actions as children.
    example: "urn:lex:br:federal:emenda.constitucional:2000-02-14;26@2000-02-14"
  type:
    type: string
    description: >-
      The deployment-defined Action-type value. Consumers can discover supported values
      and their meanings through `getSupportedActionTypes`.

      For example, a legal-domain implementation may define values such as `Amendment`,
      `Revocation`, `Creation`, `Interpretation`, `Overruling`, or `Distinguishing`.
    example: "INSERTION"
  eventTime:
    type: string
    format: date-time
    description: "The date and time associated with this Action, in UTC."
    example: "2000-02-14T00:00:00Z"
  validityInterval:
    $ref: '../core/TimeInterval.yaml'
    nullable: true
    description: >-
      An optional validity interval associated with this Action according to the
      deployment's temporal model. Its exact domain interpretation is implementation-specific.
  applicabilityInterval:
    $ref: '../core/TimeInterval.yaml'
    nullable: true
    description: >-
      An optional applicability or effectiveness interval associated with this Action
      according to the deployment's domain semantics.
  sourceVersionIds:
    type: array
    items:
      $ref: '../core/ID.yaml'
    description: >-
      The IDs of Version objects that provide source or provenance for this Action.
      The array may be empty when source provenance is unavailable or has not been linked.

      In the legal reference domain, these may identify legislative provisions or
      decision components that authorize, explain, or support the modeled event.
    example:
      - "urn:lex:br:federal:supremo.tribunal.federal:acordao:2016-02-17;hc126292@2016-02-17!majority_opinion"
  terminatesVersionIds:
    type: array
    items:
      $ref: '../core/ID.yaml'
    description: >-
      The IDs of Version objects whose validity or active state is terminated by this Action.
      The array may be empty when the Action does not terminate an existing Version.
    example:
      - "urn:lex:br:federal:constituicao:1988-10-05;1988@1988-10-05!art6_cpt"
  producesVersionIds:
    type: array
    items:
      $ref: '../core/ID.yaml'
    description: >-
      The IDs of Version objects produced by this Action. The array may be empty when
      the Action does not create a new Version.
    example:
      - "urn:lex:br:federal:constituicao:1988-10-05;1988@2000-02-14!art6_cpt"
  metadata:
    $ref: '../core/JSON.yaml'
    nullable: true
    description: >-
      A flexible field for valid JSON data providing additional context about the Action.
      Deployments may use domain vocabularies appropriate to their application. In the
      legal reference domain, schema.org vocabularies may be useful for interoperability.
