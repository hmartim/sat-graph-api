type: object
description: |
  A unified query structure for ranked retrieval that can combine semantic and
  lexical signals. The SAT-Graph API defines the observable search semantics;
  the retrieval engine, index technology, fusion method, and ranking implementation
  are deployment-specific.

  **Search Strategies:**
  - `hybrid`: Combines semantic and lexical signals in ranked retrieval (default).
  - `semanticOnly`: Uses only semantic similarity signals.
  - `lexicalOnly`: Uses only lexical/full-text signals for candidate retrieval and ranking. It does **not** request or guarantee exhaustive enumeration of all lexical matches.

  All strategies in this schema are search/ranking strategies. Exhaustive inspection
  of a known Version scope is performed by explicitly enumerating that scope and
  retrieving its TextUnits, rather than by treating search `topK` as an exhaustive
  enumeration mechanism.

  Concrete deployments may implement these semantics using different search engines,
  indexes, ranking functions, or fusion mechanisms.

properties:
  strategy:
    type: string
    enum: [hybrid, semanticOnly, lexicalOnly]
    default: hybrid
    description: |
      The search strategy to employ:
      - `hybrid`: semantic and lexical signals both participate in ranked retrieval.
      - `semanticOnly`: only semantic similarity participates in ranked retrieval.
      - `lexicalOnly`: only lexical/full-text matching participates in ranked retrieval; this does not imply exhaustive enumeration.
    example: "hybrid"

  semantic:
    type: object
    description: "Configuration for semantic search."
    properties:
      queryText:
        type: string
        description: |
          Natural-language query text used to express the semantic intent of the search.
        example: "políticas de garantia de renda mínima para famílias vulneráveis"

      weight:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
        default: 0.5
        description: |
          Relative contribution of the semantic signal in hybrid mode. Higher values
          give greater weight to semantic similarity. When both semantic and lexical
          weights are supplied, deployments should interpret them consistently as
          relative contributions to hybrid ranking.
        example: 0.7

      topK:
        type: integer
        format: int32
        minimum: 1
        description: |
          Optional. Maximum number of semantic candidates considered before final
          ranking or fusion. This is a candidate/ranking limit, not an exhaustive
          enumeration request.
        example: 100
    required:
      - queryText

  lexical:
    type: object
    description: "Configuration for lexical/full-text search."
    properties:
      queryText:
        type: string
        description: |
          Keywords or phrases for lexical/full-text retrieval. Exact syntax and
          supported lexical operators are deployment-specific and should be documented
          by the implementation.
        example: "\"artigo 6º\" OR \"renda básica\""

      weight:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
        default: 0.5
        description: |
          Relative contribution of the lexical signal in hybrid mode. Higher values
          give greater weight to lexical matching.
        example: 0.3

      topK:
        type: integer
        format: int32
        minimum: 1
        description: |
          Optional. Maximum number of lexical candidates considered before final
          ranking or fusion. This is a candidate/ranking limit, not an exhaustive
          enumeration request.
        example: 100
    required:
      - queryText

  clauses:
    type: array
    description: |
      Advanced clauses for mandatory, boosting, or exclusion conditions. The API
      defines their observable intent; the underlying query mechanism is deployment-specific.
    items:
      type: object
      properties:
        type:
          type: string
          enum: [mustContain, shouldContain, mustNotContain]
          description: |
            - `mustContain`: results must satisfy this lexical condition.
            - `shouldContain`: matching results receive a relevance boost.
            - `mustNotContain`: matching results are excluded.
          example: "mustContain"

        text:
          type: string
          description: "The term or phrase for this clause."
          example: "Constituição Federal"

        boost:
          type: number
          format: float
          minimum: 0.0
          default: 1.5
          description: |
            Relative boost for `shouldContain` clauses. Ignored for other clause types.
        example: 2.0
      required:
        - type
        - text
    example:
      - type: "mustContain"
        text: "Constituição Federal"
      - type: "shouldContain"
        text: "direitos sociais"
        boost: 1.8

anyOf:
  - required: [semantic]
  - required: [lexical]

example:
  strategy: "hybrid"
  semantic:
    queryText: "políticas de garantia de renda mínima para famílias vulneráveis"
    weight: 0.7
  lexical:
    queryText: "\"artigo 6º\" OR \"renda básica\""
    weight: 0.3
  clauses:
    - type: "mustContain"
      text: "Constituição Federal"
