#
# OpenAPI 3.x Schema for the 'Item' Data Model
#
# This file defines the schema for the 'Item' object, which represents a timeless,
# structural or conceptual entity within the SAT-Graph.
#
# It is intentionally atemporal and does not contain textual content itself; that
# is handled by the 'Version' and 'TextUnit' models.
#
type: object
description: >
  Represents a timeless, foundational entity within the SAT-Graph. An `Item`
  acts as a stable, version-agnostic anchor for a structural or conceptual entity.

  A deployment may use Items for whole documents, document components, abstract
  concepts, named entities, or other domain-defined anchors. In the legal reference
  domain, examples include a Constitution, Article, Paragraph, legal concept, or institution.

  The `Item` itself is a structural and conceptual anchor. Its textual representations
  are provided by associated `TextUnit` objects, while time-varying state is represented
  through `Version` objects.

  An Item remains addressable independently of whether it currently has a valid or
  applicable Version. Expiration, revocation, repeal, replacement, or other temporal
  changes affect Versions and their temporal state; they do not by themselves remove
  the canonical Item.
required:
  - id
  - typeId
  - label
properties:
  id:
    $ref: '../core/ID.yaml'
    description: >-
      The primary identifier for this Item. The field is a string with no format
      restriction, allowing each implementation to choose an appropriate strategy,
      such as UUIDs, deterministic hashes, URNs, or URIs.
  urn:
    type: string
    nullable: true
    description: >-
      An optional persistent semantic identifier expressed as a URN when the deployment
      uses a URN-based identification scheme. The concrete namespace and syntax are
      deployment-specific. In the legal reference domain, URN LEX is one example.
    minLength: 1
    example: "urn:lex:br:federal:constituicao:1988-10-05;1988!art5"
  url:
    type: string
    format: uri
    nullable: true
    description: >-
      An optional canonical electronic address for this Item or an authoritative source
      associated with it. The concrete meaning is deployment-specific and is not used by
      the core API for graph inference.
    minLength: 1
    example: "https://normas.leg.br/?urn=urn:lex:br:federal:constituicao:1988-10-05;1988!art5"
  typeId:
    $ref: '../core/ID.yaml'
    description: >-
      The unique identifier of the ItemType that classifies this Item. The ItemType
      taxonomy defines the deployment's formal structural or conceptual type system.
      In a legal-domain implementation, example types may include Constitution,
      Article, or Paragraph.
    example: "article"
  label:
    type: string
    description: "The human-readable label or title for the Item."
    minLength: 1
    example: "Brazilian Constitution of 1988"
  parentId:
    $ref: '../core/ID.yaml'
    nullable: true
    description: >-
      The canonical, atemporal parent adopted by the implementation for this Item.
      This field defines the Item-level hierarchy used by Item navigation and does
      not encode historical structural position. Historical structural states are
      represented through Version-level relationships.
  metadata:
    $ref: '../core/JSON.yaml'
    nullable: true
    description: >-
      A flexible field for any valid JSON data containing atemporal, domain-specific
      properties of the Item.

      **Best Practice:** Use internationally recognized vocabularies where appropriate
      to improve semantic interoperability. In the legal reference domain,
      schema.org/Legislation is one possible vocabulary. See
      [Metadata Best Practices](../../docs/METADATA_BEST_PRACTICES.md) for guidance.
