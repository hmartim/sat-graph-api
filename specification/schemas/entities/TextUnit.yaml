#
# OpenAPI 3.x Schema for the 'TextUnit' Data Model
#
# This file defines the schema for the 'TextUnit' object, which is the
# fundamental, retrievable unit of textual content in the SAT-Graph.
#
# It incorporates the concepts of Language Version (LV) and Component Language
# Version (CLV) from the SAT-Graph ontology and supports the "multi-aspect retrieval"
# strategy by associating any piece of text with a source node and a specific
# semantic 'aspect'.
#
type: object
description: >
  Represents a concrete piece of textual information. It is a flexible object
  used to hold any aspect of text associated with a primary entity in the graph.
required:
  - id
  - sourceType
  - sourceId
  - language
  - aspect
  - content
properties:
  id:
    $ref: '../core/ID.yaml'
    description: "A unique identifier for this specific piece of text."
    example: "urn:lex:br:federal:constituicao:1988@1988-10-05~text;pt!art1_par1"
  sourceType:
    type: string
    description: >-
      The type of the source node in the graph to which this text is attached.
      This provides essential context for the retrieved text.
    enum:
      - "Theme"
      - "Item"
      - "Version"
      - "Action"
      - "Relation"
    example: "Version"
  sourceId:
    $ref: '../core/ID.yaml'
    description: "The unique ID of the source node."
    example: "urn:lex:br:federal:constituicao:1988@1988-10-05!art1_par1"
  language:
    type: string
    description: "The language of the content, specified as an IETF BCP 47 tag."
    pattern: "^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]+)*$"
    example: "pt-BR"
  aspect:
    type: string
    minLength: 1
    description: >-
      The deployment-defined semantic role of this TextUnit relative to its source
      node. Aspect vocabularies are implementation- and domain-specific; consumers
      can discover supported values and their meanings through
      `getSupportedTextUnitAspects`.

      For example, a legal-domain implementation may define aspects such as
      `canonical` for primary official text, `summary` for a condensed description,
      `indexical` for alternative identifiers or names, and `ratio`, `facts`, or
      `holding` for case-law material.
    example: "canonical"
  content:
    type: string
    minLength: 1
    description: >-
      The textual content of this unit. How content is segmented, normalized,
      contextualized, generated, or otherwise materialized is implementation-
      and domain-specific and may vary by `aspect`. The API does not prescribe
      those materialization conventions. Consumers should consult the
      implementation's documentation for the conventions applicable to each
      aspect. Unit-specific information may be provided in `metadata`.
    example: "Todo o poder emana do povo, que o exerce por meio de representantes eleitos ou diretamente, nos termos desta Constituição."
  metadata:
    $ref: '../core/JSON.yaml'
    nullable: true
    description: >-
      A flexible field for any valid JSON data providing structured or
      additional metadata about this TextUnit. When a TextUnit represents an
      aspect of a Theme or Item (e.g., its description or summary), this field
      can optionally contain its structured representation alongside the natural
      language textual representation in the `content` property.


      **Best Practice:** Use internationally recognized vocabularies such as schema.org
      to enable semantic interoperability. See [Metadata Best Practices](../../docs/METADATA_BEST_PRACTICES.md)
      for guidance on structuring text unit metadata.