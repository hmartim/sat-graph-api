type: object
description: "Specifies the criteria for retrieving a batch of valid Version objects."
required:
  - itemIds
  - at
properties:
  itemIds:
    type: array
    description: "A list of canonical IDs for the Items whose valid versions are requested."
    items:
      $ref: '../core/ID.yaml'
    minItems: 1
    uniqueItems: true
  at:
    type: string
    format: date-time
    description: "The specific UTC date-time for which to check validity for all items (Valid Time)."
  observerTime:
    type: string
    format: date-time
    description: >-
      Optional. The transaction-time perspective from which to view the graph.
      Only facts known or recorded by the system at or before this perspective may
      affect the result. This is distinct from the event time or valid time of those
      facts. If omitted, defaults to "now" (the current recorded knowledge perspective).