type: object
description: |
  The request body for the searchTextUnits operation.

  This endpoint performs **semantic and lexical discovery** within a defined scope. All search strategies, including `lexicalOnly`, are ranked discovery strategies and do not guarantee exhaustive enumeration of all matching TextUnits. For deterministic fetching of TextUnits by specific Version IDs, use `getBatchTextUnits` instead.

  For exhaustive inspection of a known Version scope, explicitly enumerate that scope, retrieve its TextUnits with `getBatchTextUnits`, and evaluate the desired criterion over the complete retrieved set.

  **Scoping:**
  - Use `itemIds` and/or `themeIds` to define structural or thematic scope.
  - Use `versionIds` to restrict ranked search to an exact set of Versions.
  - Use `at` to constrain temporally; if omitted, no temporal filter is applied.
  - Use `temporalPredicate` to select validity or applicability when `at` is provided.
  - If none of `itemIds`, `itemUrns`, `versionIds`, or `themeIds` is provided, the search applies globally across accessible data.
  - Multiple scope filters are intersected.

  **Structural Scoping — `itemIds` vs `itemUrns`:**
  Both filters define hierarchical structural scope. `itemIds` uses deployment identifiers.
  `itemUrns` is available to deployments whose semantic URN scheme supports structural
  identification or hierarchical scoping. The traversal and optimization mechanism are
  implementation-specific. In the legal reference domain, LEX URNs are one example.

  **Version Scoping:**
  `versionIds` defines an exact Version scope and performs no hierarchical expansion.

  **Temporal Filtering:**
  - If `at` is omitted, no temporal filter is applied.
  - If `at` is provided and `temporalPredicate` is omitted, `validity` is used.
  - `validity` filters by `validityInterval`.
  - `applicability` filters by `applicabilityInterval`; if absent, the implementation MUST fall back to `validityInterval`, matching `getApplicableVersions`.
  - Supplying `temporalPredicate` without `at` is invalid and MUST result in HTTP 400.
  - Ranked search uses the current transaction-time perspective; `observerTime` is not part of this operation.
properties:
  itemIds:
    type: array
    items:
      $ref: '../core/ID.yaml'
    description: |
      Optional. Item IDs treated as roots of a hierarchical structural scope.
    example: ["urn:lex:br:federal:lei:2002-01-10;10406"]
  itemUrns:
    type: array
    items:
      type: string
    description: |
      Optional. Semantic URNs treated as roots of a hierarchical structural scope
      when the deployment's URN scheme supports that behavior. The identifier scheme
      and traversal mechanism are implementation-specific; LEX URNs are a legal-domain example.
    example: ["urn:lex:br:federal:lei:2002-01-10;10406"]
  versionIds:
    type: array
    items:
      $ref: '../core/ID.yaml'
    minItems: 1
    uniqueItems: true
    description: |
      Optional. Exact Version IDs defining the ranked-search candidate universe.
      No hierarchical expansion is performed. When combined with other filters,
      all constraints are intersected.
  itemTypeIds:
    type: array
    items:
      $ref: '../core/ID.yaml'
    description: "Optional. Restricts results to TextUnits associated with Items of the specified types."
  themeIds:
    type: array
    items:
      $ref: '../core/ID.yaml'
    description: "Optional. Theme IDs defining thematic scope."
  metadataFilter:
    $ref: '../common/MetadataFilter.yaml'
  at:
    type: string
    format: date-time
    description: |
      Optional. UTC date-time at which to apply the selected temporal predicate.
      If omitted, no temporal filter is applied.
  temporalPredicate:
    type: string
    enum: [validity, applicability]
    default: validity
    description: |
      Optional. Selects the temporal predicate used when `at` is provided.
      Supplying this parameter without `at` is invalid and MUST result in HTTP 400.
  contentQuery:
    $ref: '../common/ContentQuery.yaml'
  language:
    type: string
    description: "The IETF BCP 47 language code for the content."
    example: "pt-BR"
  aspects:
    type: array
    items:
      type: string
    minItems: 1
    uniqueItems: true
    description: >-
      Optional. Restricts ranked search to the specified deployment-defined TextUnit
      aspects. If omitted, all available aspects are considered. Supported values and
      their meanings can be discovered through `getSupportedTextUnitAspects`.
    example: ["canonical", "summary"]
  topK:
    type: integer
    format: int32
    default: 10
    minimum: 1
    description: |
      The maximum number of ranked results to return. Increasing `topK` does not convert
      this operation into exhaustive enumeration.
  dataSources:
    $ref: '../common/DataSourcesSchema.yaml'
    description: "Optional. Scopes the search to a specific list of granted data sources."
