type: object
description: "Specifies the criteria for retrieving a batch of TextUnit objects by Version IDs."
required:
  - versionIds
  - language
properties:
  versionIds:
    type: array
    description: "A list of identifiers for the Versions of interest."
    items:
      $ref: '../core/ID.yaml'
    minItems: 1
    uniqueItems: true
  language:
    type: string
    description: "The language code to retrieve (e.g., 'pt-br', 'en')."
    pattern: "^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]+)*$"
    example: "pt-br"
  aspects:
    type: array
    description: |
      Optional. Restricts retrieval to the specified deployment-defined TextUnit
      aspects. If omitted, all available aspects are returned. Supported values
      and their meanings can be discovered through `getSupportedTextUnitAspects`.
    items:
      type: string
    minItems: 1
    uniqueItems: true
    example: ["canonical", "summary"]
