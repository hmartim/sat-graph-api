type: object
deprecated: true
description: |
  **Deprecated.** This request schema belonged to an earlier multi-scope Item hierarchy operation and is retained for compatibility only. It is not used by the current hierarchy endpoint.

  Structural Item enumeration is performed by `GET /items/{itemId}/hierarchy`, which accepts a single Item root and an optional `depth` parameter. Multiple roots can be traversed through independent calls to that endpoint.

  This schema may be removed in a future major version.
properties:
  itemIds:
    type: array
    items:
      $ref: '../core/ID.yaml'
    description: "Legacy. A list of Item IDs that defined structural scopes for the former multi-scope hierarchy operation."
  themeIds:
    type: array
    items:
      $ref: '../core/ID.yaml'
    description: "Legacy. A list of Theme IDs that defined thematic scopes for the former multi-scope hierarchy operation."
  depth:
    type: integer
    description: >
      Legacy. Controlled traversal depth for Item-based scopes. The current `GET /items/{itemId}/hierarchy` endpoint exposes `depth` directly as a query parameter.
    default: -1
  itemTypeIds:
    type: array
    items:
      $ref: '../core/ID.yaml'
    description: >
      Legacy. Filtered the results of the former multi-scope hierarchy operation by ItemType.
    example: ["item-type:article", "item-type:paragraph"]
  dataSources:
    $ref: '../common/DataSourcesSchema.yaml'
    description: "Legacy. Explicit data-source scoping for the former multi-scope hierarchy operation."
