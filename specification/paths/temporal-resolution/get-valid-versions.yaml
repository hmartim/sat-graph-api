get:
  tags:
    - "Temporal Resolution Actions"
  summary: "Gets all Versions of an Item that were valid at a specific time."
  operationId: "getValidVersions"
  description: |
    Deterministically returns all Versions of an Item whose `validityInterval`
    contains the requested valid-time instant, evaluated from an optional
    transaction-time perspective.

    ### Temporal Query Logic

    The primitive distinguishes two temporal dimensions:
    - **Valid Time** (`at`): the modeled-domain time for which Version validity is evaluated.
    - **Transaction Time** (`observerTime`): the recorded-knowledge perspective from which the graph is observed.

    If `observerTime` is omitted, the current recorded knowledge perspective is used.
    If `observerTime` is supplied, only facts known or recorded by the system at or
    before that transaction-time perspective may affect the result. This perspective
    is distinct from event time and valid time.

    The query returns all Versions whose validity interval encompasses the target instant
    (`validityStart <= at < validityEnd`, with an open end treated as unbounded).
    Multiple Versions may coexist for the same Item when the deployment's domain model
    permits overlapping valid states.

    ### Legal reference-domain example

    In a legal implementation, a statutory textual Version and one or more interpretive
    Versions may coexist at the same valid time. The API returns the Versions that satisfy
    the temporal predicate and does not impose a legal hierarchy or select which one an
    application should treat as controlling.

  x-sat-graph-agent:
    version: 1
    when-to-use: >-
      After anchoring an Item, retrieve the Version or Versions formally valid at a date.
    not-for: >-
      Applicability/effectiveness semantics — use getApplicableVersions; full Version
      history — use getItemVersions.
    pairs-with: [resolveItemReference, getApplicableVersions, getBatchTextUnits]
    caveats: >-
      `observerTime` selects a transaction-time perspective; omit it to use the current recorded knowledge perspective.
    role: temporal

  security:
    - ApiKeyAuth: []

  parameters:
    - name: itemId
      in: path
      required: true
      description: "The canonical ID of the Item whose valid Versions are requested."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/ID'
    - name: at
      in: query
      required: false
      description: |
        Optional. The UTC date-time for which validity is evaluated.
        If omitted, defaults to the current system time.
      schema:
        type: string
        format: date-time
      example: "1999-06-01T12:00:00Z"
    - name: observerTime
      in: query
      required: false
      description: >-
        Optional. The transaction-time perspective from which to view the graph.
        Only facts known or recorded by the system at or before this perspective may
        affect the result. If omitted, the current recorded knowledge perspective is used.
      schema:
        type: string
        format: date-time
      example: "2015-06-01T12:00:00Z"

  responses:
    '200':
      description: "Successfully retrieved the Version objects valid at the specified time. The array may contain one or more Versions."
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../openapi.yaml#/components/schemas/Version'
    '404':
      description: "Not Found - Either the Item does not exist or no Version is valid at the specified time."
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
    '400':
      $ref: '../../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../../openapi.yaml#/components/responses/Forbidden'
