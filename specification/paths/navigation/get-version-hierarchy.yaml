get:
  tags:
    - "Structural Navigation Actions"
  summary: "Gets all Version IDs within the hierarchy of a given Version."
  operationId: "getVersionHierarchy"
  description: |
    Enumerates and returns all descendant Version IDs within the structural hierarchy of a specified Version.

    A Version represents a specific structural state of an Item. The descendants returned by this operation are the descendant Versions that compose that stored Version state. Traversal is deterministic for the supplied `versionId` and does not perform temporal resolution.

    ### Use Cases
    This action is ideal for:
    - Traversing a Version's stored structural hierarchy to collect all descendant Version IDs
    - Understanding the composition of a specific Version state
    - Building Version ID lists for batch operations (e.g., `getBatchTextUnits` or `getBatchVersions`)
    - Building an exact Version scope for ranked search with `searchTextUnits(versionIds=...)`
    - Efficient batch processing where only Version IDs are needed

    ### Discussion
    This action's purpose is **structural enumeration and navigation** of a Version state, not temporal resolution or version filtering. Temporal resolution occurs separately, for example through `getValidVersions` or `getApplicableVersions`; once a Version has been selected, this operation traverses the structural relationships stored for that Version.

    Version-level structural navigation does not independently evaluate the `validityInterval` or `applicabilityInterval` of descendant Versions. Consumers that need the temporal status of individual descendants can retrieve or resolve those Versions separately.

    A Version can be reused by multiple parent Versions over time. This does not make downward traversal ambiguous: the supplied parent Version determines the structural children and descendants that compose that Version state. Upward navigation can require temporal context to select among multiple historical parents; use `getVersionParents` or `getVersionAncestors` for that purpose.

    **Efficiency Note:** Returns only Version ID strings rather than full Version objects, making it ideal for hierarchical traversal workflows where IDs are subsequently used in batch operations.

  x-sat-graph-agent:
    version: 1
    when-to-use: Enumerate all descendant Version IDs that compose a specific Version state.
    not-for: >-
      Temporal resolution — use getValidVersions/getApplicableVersions.
      The stable Item subtree — use getItemHierarchy.
    pairs-with: [getValidVersions, getApplicableVersions, getBatchVersions, getBatchTextUnits, searchTextUnits]
    role: structural

  security:
    - ApiKeyAuth: []

  parameters:
    - name: versionId
      in: path
      required: true
      description: The unique ID of the Version whose descendants should be retrieved.
      schema:
        $ref: '../../openapi.yaml#/components/schemas/ID'
    - name: depth
      in: query
      required: false
      description: |
        Controls traversal depth. If `depth=1`, only direct children are returned. If omitted or negative, all descendants are returned recursively.
      schema:
        type: integer
        default: -1

  responses:
    '200':
      description: "A list of descendant Version IDs (strings) that compose the supplied Version state, ordered by hierarchical depth and position."
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../openapi.yaml#/components/schemas/ID'
    '400':
      $ref: '../../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFound'
