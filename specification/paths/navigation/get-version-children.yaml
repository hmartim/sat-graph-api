get:
  tags:
    - "Structural Navigation Actions"
  summary: "Returns the immediate structural children of a specific Version."
  operationId: "getVersionChildren"
  description: |
    Given a Version ID, this action returns the list of its immediate structural children
    (component Versions that comprise this stored Version state).

    This is a **deterministic action**: Given the same `versionId`, it will always return
    the same set of children Versions.

    The endpoint traverses the structural relationships recorded for the supplied Version.
    It does not prescribe how an implementation ingests, constructs, propagates, or reuses
    those relationships, and it does not independently resolve the temporal status of child
    Versions during traversal.

    This endpoint is designed for efficient structural navigation without loading potentially
    large child arrays into every Version response.
  x-sat-graph-agent:
    version: 1
    when-to-use: >-
      Immediate structural children of a specific Version — when the shape of
      that version matters.
    not-for: The current item tree — use getItemChildren.
    pairs-with: [getValidVersions]
    role: structural

  security:
    - ApiKeyAuth: []

  parameters:
    - name: versionId
      in: path
      required: true
      description: "The unique identifier of the Version whose children are to be retrieved."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/ID'

  responses:
    '200':
      description: "Successfully retrieved the children of the Version."
      content:
        application/json:
          schema:
            type: array
            description: "An array of Version objects representing the immediate structural children."
            items:
              $ref: '../../openapi.yaml#/components/schemas/Version'
    '400': { $ref: '../../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../../openapi.yaml#/components/responses/Forbidden' }
    '404': { $ref: '../../openapi.yaml#/components/responses/NotFound' }
