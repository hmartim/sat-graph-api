get:
  tags:
    - "Introspection & Metadata Actions"
  summary: "Gets the Action types supported by this deployment."
  operationId: "getSupportedActionTypes"
  description: |
    Returns the deployment-defined Action-type vocabulary together with a label
    and semantic description for each value. Action types are not fixed by the
    SAT-Graph core and may vary by implementation and domain.

    ### Discussion
    This action allows consumers to discover valid Action-type values and their
    deployment-specific meaning without hardcoding ontology-specific vocabularies.
  x-sat-graph-agent:
    version: 1
    when-to-use: >-
      Discover the Action-type vocabulary and the meaning of each value before building a causal query.
    pairs-with: [queryActions, getItemHistory]
    role: introspection

  security:
    - ApiKeyAuth: []

  responses:
    '200':
      description: "The supported Action-type vocabulary."
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../openapi.yaml#/components/schemas/VocabularyEntry'
          example:
            - value: "INSERTION"
              label: "Insertion"
              description: "Legal-domain example: an Action that introduces new textual or structural content."
            - value: "REVOCATION"
              label: "Revocation"
              description: "Legal-domain example: an Action that terminates the validity of a Version without replacing it."
    '401':
      $ref: '../../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../../openapi.yaml#/components/responses/Forbidden'
