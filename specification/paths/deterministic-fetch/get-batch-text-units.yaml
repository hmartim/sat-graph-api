post:
  tags: ["Deterministic Fetch Actions"]
  summary: "Gets a batch of TextUnit objects by the IDs of their source Versions."
  operationId: "getBatchTextUnits"
  description: |
    A batch-optimized version of getVersionTextUnits. Given a list of Version identifiers,
    it efficiently retrieves their corresponding textual content.

    This action is critical for use cases that require inspecting the content of multiple
    versions, such as finding the exact point of a textual change within a long version history.
    It prevents the severe performance degradation that would result from iterating and calling
    getVersionTextUnits individually for each version.

    This operation is also the recommended deterministic hydration step for exhaustive inspection
    of an explicitly enumerated Version scope. Implementations MAY impose operational limits on
    batch size. If a request exceeds an implementation-specific limit, the operation MUST fail
    explicitly; it MUST NOT silently truncate the requested Version set or return a partial batch
    as if it were complete.

    When consumers inspect or apply local lexical criteria to returned `content`, they should
    account for the implementation-specific materialization conventions of the requested aspects.
    Segmentation, normalization, contextualization, generation, and related conventions are not
    prescribed by the SAT-Graph API and should be documented by the implementation.
  x-sat-graph-agent:
    version: 1
    when-to-use: >-
      Retrieve TextUnits for several known Versions in one call — the precise
      hydration tool once the Version IDs defining the admissible universe are resolved.
    not-for: Text of a single version by traversal — use getVersionTextUnits.
    pairs-with: [getValidVersions, getItemVersions, getVersionHierarchy]
    caveats: >-
      Implementations may impose batch-size limits, but requests exceeding such
      limits must fail explicitly and must never be silently truncated. Interpretation
      of returned content must follow the implementation's documented materialization
      conventions for the requested aspects.
    role: hydration

  security:
    - ApiKeyAuth: []
  requestBody:
    description: "The criteria for retrieving a batch of TextUnit objects."
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/requests/GetBatchTextUnitsRequest.yaml'
  responses:
    '200':
      description: "A complete list of TextUnit objects matching the requested Version IDs, language, and aspects within the accepted batch."
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../schemas/entities/TextUnit.yaml'
    '400': { $ref: '../../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../../openapi.yaml#/components/responses/Forbidden' }
