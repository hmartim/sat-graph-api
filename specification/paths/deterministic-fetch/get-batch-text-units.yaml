post:
  tags: ["Deterministic Fetch Actions"]
  summary: "Gets a batch of TextUnit objects by the IDs of their source Versions."
  operationId: "getBatchTextUnits"
  description: |
    A batch-optimized version of getVersionTextUnits. Given a list of Version identifiers,
    it efficiently retrieves their corresponding textual content.

    This action is critical for use cases that require inspecting the content of multiple
    versions, such as finding the exact point of a textual change within a long version history.
    It prevents the severe performance degradation that would result from iterating and calling
    getVersionTextUnits individually for each version.
  x-sat-graph-agent:
    version: 1
    when-to-use: >-
      Retrieve canonical text for several known Versions in one call — the
      precise tool once version IDs are resolved.
    not-for: Text of a single version by traversal — use getVersionTextUnits.
    pairs-with: [getValidVersions, getItemVersions]
    role: hydration

  security:
    - ApiKeyAuth: []
  requestBody:
    description: "The criteria for retrieving a batch of TextUnit objects."
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/requests/GetBatchTextUnitsRequest.yaml'
  responses:
    '200':
      description: "A list of the requested TextUnit objects."
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../schemas/entities/TextUnit.yaml'
    '400': { $ref: '../../openapi.yaml#/components/responses/BadRequest' }
    '401': { $ref: '../../openapi.yaml#/components/responses/Unauthorized' }
    '403': { $ref: '../../openapi.yaml#/components/responses/Forbidden' }