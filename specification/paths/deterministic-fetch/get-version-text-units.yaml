get:
  tags:
    - "Deterministic Fetch Actions"
  summary: "Gets all TextUnits for a Version, optionally filtered by language and aspects."
  operationId: "getVersionTextUnits"
  description: |
    Deterministically retrieves all `TextUnit` objects associated with a single, known `Version`,
    optionally filtered by language and one or more textual aspects. If `aspects` is omitted,
    returns all aspects available for that Version.

    If the Version exists but no TextUnits satisfy the requested language and/or aspects,
    the operation returns `200 OK` with an empty array. A `404` indicates that the requested
    Version itself does not exist.

    This is a direct-access, primary-key-based lookup, not a search operation.

    ### Discussion
    This action is fundamentally different from `searchTextUnits`. While the latter is a
    probabilistic discovery tool, `getVersionTextUnits` is a deterministic fetch. It serves
    the critical use case where an agent has already identified a specific `Version`
    (e.g., via `getValidVersions`) and requires its textual content.
  x-sat-graph-agent:
    version: 1
    when-to-use: Retrieve the text units of one Version, optionally by language and aspects.
    not-for: Several versions at once — use getBatchTextUnits.
    pairs-with: [getValidVersions]
    role: hydration

  security:
    - ApiKeyAuth: []

  parameters:
    - name: versionId
      in: path
      required: true
      description: "The unique identifier of the Version whose TextUnits are requested."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/ID'
    - name: language
      in: query
      required: false
      description: |
        Optional. The IETF BCP 47 language code to filter results.
        If omitted, TextUnits for all available languages are returned.
      schema:
        type: string
        pattern: "^[a-zA-Z]{2,3}(?:-[a-zA-Z0-9]+)*$"
      example: "pt-BR"
    - name: aspects
      in: query
      required: false
      description: |
        Optional. Filters results to TextUnits whose semantic role is one of the supplied values.
        Supported values are deployment-defined and can be discovered through
        `getSupportedTextUnitAspects`. In the legal reference domain, examples may include
        `canonical`, `summary`, `indexical`, `ratio`, `facts`, or `holding`.
        If omitted, TextUnits of all aspects are returned.
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
      example: [ "canonical", "summary" ]

  responses:
    '200':
      description: "Successfully retrieved matching TextUnits for the specified Version. The array may be empty if no TextUnits satisfy the optional filters."
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../openapi.yaml#/components/schemas/TextUnit'
    '401':
      $ref: '../../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../../openapi.yaml#/components/responses/Forbidden'
    '404':
      description: "Not Found - The requested Version does not exist."
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/ErrorResponse'
