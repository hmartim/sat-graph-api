get:
  tags:
    - "Deterministic Fetch Actions"
  summary: "Get a single Item by its canonical ID."
  operationId: "getItem"
  description: |
    Retrieves the full `Item` object given its unique, canonical ID.
    
    ### Discussion
    This is a core deterministic action for retrieving a specific structural node from the graph. It is a direct, primary-key-based lookup.
  x-sat-graph-agent:
    version: 1
    when-to-use: >-
      Hydrate one Item by canonical ID when a single object's fields (label,
      typeId, parentId) are needed.
    not-for: >-
      Several known IDs — use getBatchItems. Turning a textual reference into an
      ID — use resolveItemReference.
    pairs-with: [getItemAncestors, getValidVersions]
    role: hydration

  security:
    - ApiKeyAuth: []

  parameters:
    - name: itemId
      in: path
      required: true
      description: "The canonical ID of the Item to retrieve."
      schema:
        $ref: '#/components/schemas/ID'

  responses:
    '200':
      description: "Successfully retrieved the Item object."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Item'

    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'
