get:
  tags:
    - "Deterministic Fetch Actions"
  summary: "Get a single Relation by its unique ID."
  operationId: "getRelation"
  description: "Retrieves the full `Relation` object given its unique identifier. Useful for inspecting the details of a specific link between entities."
  x-sat-graph-agent:
    version: 1
    when-to-use: Hydrate one Relation edge by ID.
    not-for: Discovering relations by criteria — use getRelations.
    pairs-with: [getRelations]
    role: hydration

  security:
    - ApiKeyAuth: []
  parameters:
    - name: relationId
      in: path
      required: true
      description: "The unique identifier of the Relation to retrieve."
      schema:
        $ref: '../../openapi.yaml#/components/schemas/ID'
  responses:
    '200':
      description: "Successfully retrieved the Relation object."
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Relation'
    '401':
      $ref: '../../openapi.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../../openapi.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFound'
