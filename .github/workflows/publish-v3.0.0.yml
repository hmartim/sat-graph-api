name: Publish SAT-Graph API v3.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3.0.0.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: 13d67791481375e497ff6f5ab47635e60e299dc0

      - name: Publish v3.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.0.0 --repo hmartim/sat-graph-api >/dev/null 2>&1; then
            echo "Release v3.0.0 already exists."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## SAT-Graph API 3.0.0

          This major release consolidates the SAT-Graph API as a domain-neutral canonical primitive interface while retaining legal information as its primary reference domain.

          ### Highlights
          - Open, deployment-defined vocabularies for `Version.type`, `TextUnit.aspect`, `Action.type`, and `Relation.predicate`.
          - Structured vocabulary introspection through `VocabularyEntry { value, label, description }`.
          - New introspection endpoints for version types, TextUnit aspects, and relation predicates.
          - Historical structural scoping for ranked TextUnit retrieval through exact `versionIds`.
          - Explicit ranked temporal filtering with `temporalPredicate = validity | applicability`.
          - Omitted TextUnit `aspects` now means all supported aspects rather than an implicit `canonical` default.
          - Search semantics clarified as ranked, non-exhaustive retrieval; exhaustive inspection is composed through explicit scope enumeration and deterministic retrieval.
          - Core contract made technology-neutral and ingestion-neutral.
          - `citationBoost` removed from the core search contract.
          - Source and bundled OpenAPI specifications are validated and kept synchronized by CI.

          ### Breaking changes from 2.x
          - `getSupportedActionTypes` now returns structured `VocabularyEntry[]` rather than `string[]`.
          - Omitted `aspects` filters now consider or return all supported aspects according to each operation's contract.
          - Deployment-controlled vocabularies are no longer closed core enums.

          See `docs/MIGRATING_TO_3.0.md` for migration guidance.
          EOF

          gh release create v3.0.0 \
            --repo hmartim/sat-graph-api \
            --target 13d67791481375e497ff6f5ab47635e60e299dc0 \
            --title "SAT-Graph API 3.0.0" \
            --notes-file /tmp/release-notes.md \
            specification/openapi-bundled.yaml#openapi-bundled.yaml
