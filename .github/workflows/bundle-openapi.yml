name: Validate and Bundle OpenAPI Specification

on:
  push:
    branches: [main]
    paths:
      - 'specification/**'
      - '.github/workflows/bundle-openapi.yml'
  pull_request:
    paths:
      - 'specification/**'
      - '.github/workflows/bundle-openapi.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-and-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cd specification
          npm install

      - name: Validate source specification
        run: |
          cd specification
          npm run validate

      - name: Bundle OpenAPI specification
        run: |
          cd specification
          npm run bundle

      - name: Validate bundled specification
        run: |
          cd specification
          npm run validate-bundled

      - name: Upload generated bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-bundled
          path: specification/openapi-bundled.yaml
          retention-days: 30

      - name: Synchronize committed bundle
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- specification/openapi-bundled.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add specification/openapi-bundled.yaml
            git commit -m "Regenerate OpenAPI bundle"
            git push
          fi

      - name: Verify committed bundle is synchronized
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          git diff --exit-code -- specification/openapi-bundled.yaml

      - name: Upload bundled spec to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./specification/openapi-bundled.yaml
          asset_name: openapi-bundled.yaml
          asset_content_type: application/x-yaml
